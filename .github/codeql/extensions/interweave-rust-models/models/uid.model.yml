#
# rust/cleartext-logging finds its SOURCES BY NAME: a call whose target
# function is named like an id ("uid" among them), or a variable or
# field so named, is "sensitive data", and a panic!, assert! or eprintln!
# it reaches is the "log". ADR-0028's refusals name the owner uid and
# mode of the component that broke the rule on purpose, so every test
# that prints such a refusal with {:?} raised a "high" alert, dismissed
# by hand each time (alerts 1, 22-42).
#
# A barrierModel row on a function's ReturnValue (the call node, which
# is the source node) stops that function's result being a source for
# taint kind `log-injection`. That kind is SHARED: rust-all reads it as
# the barrier of rust/cleartext-logging and of rust/log-injection alike,
# so a row silences both for that value. Every other name the heuristic
# matches, a `password` included, still alerts.
#
# Measured with CodeQL 2.27.1 (the version default setup ran on #228) on
# #228's profile-config and profile-identity: 31 results without this
# pack, 24 with it — every `effective_uid(...)` and `meta.uid()` source
# gone; a canary `eprintln!("{password}")` still reported with it.
#
# WHAT NO ROW CAN DO: a VARIABLE or FIELD named like a uid is a source
# by its name, and models name functions only. The 24 left are all of
# that shape — a `uid` parameter or local in load.rs/persist.rs reaching
# a test's panic. The crates' owners keep those names where the value
# is a uid (p2p-network-dev-01's GZCoord reply of 2026-10-08,
# 01a11c68-d4ef-7e60-a9ac-effb421521b5), so such an alert is dismissed as
# "false positive" by the PR's author once the value is traced to a
# POSIX account uid — the pr-lifecycle skill says how.
#
# THE RULE FOR A ROW: it names one function, says what the function
# returns, why that value is not the secret its name suggests, and that
# it is not text an attacker can shape — in practice a number, since the
# row is a log-injection barrier too. A row that cannot say all three is
# not reviewable. The path is the canonical
# one — the crate's `lib` name (hyphens as underscores) and the module
# that defines the function, not a re-export; a trait method as
# `<Type as path::Trait>::method`. A row whose path matches nothing is
# silently inert: the alert it was for comes back, which is the signal.
extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      # This process's effective uid, a u32 read from /proc/self/status.
      # A uid is an account number, not a credential, and ADR-0028's
      # refusals print this one on purpose.
      - ["interweave_profile_config::persist::effective_uid", "ReturnValue", "log-injection", "manual"]
      # A file's owner uid, a u32 from stat(2). Not a secret for the same
      # reason; the refusals name the owner of the component they judged.
      - ["<std::fs::Metadata as std::os::unix::fs::MetadataExt>::uid", "ReturnValue", "log-injection", "manual"]
