#
# Everything in tools/ runs here, because a check that runs only when
# someone remembers is not a check. Ten self-test suites and five tree
# checks existed for a while with nothing invoking them.
#
# TWO THINGS ABOUT THIS FILE ARE LOAD-BEARING AND EASY TO BREAK:
#
#   1. `merge_group` is NOT optional. `main` is behind a merge queue, and
#      the queue builds its own ref — a workflow that triggers only on
#      `pull_request` never reports for that build, so every required
#      check sits "expected" and the queue waits forever. That is the
#      exact stall wait-merged.sh exit 6 was written to name.
#
#   2. A job's `name:` IS its required-check context. Renaming a job
#      silently un-gates `main`: the ruleset keeps requiring a context
#      that no longer exists, and nothing reports it, so the queue hangs
#      the same way. Rename a job only together with the ruleset
#      (CLAUDE.md §9). ADDING a job has the mirror-image failure: the
#      job runs, reports, and gates nothing at all until its name is
#      added to the ruleset's required_status_checks.
#
# Contexts reported here: `rust`, `tree checks`, `tool self-tests`.
#
# Deliberately NOT conditional-per-surface. The whole run is ~2 minutes
# wall clock (checks 4s, suites 1m45s, in parallel), so a `changes` job
# and per-surface `run` inputs would add machinery that costs more to
# understand than the runners it saves.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per ref. A superseded push has nothing to say, but never
  # cancel a merge-queue build: the queue is waiting on its result.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # CONTEXT NAME: `rust`. Like the two below, this string is what the
    # ruleset requires — see the note above before touching it.
    #
    # Cargo-only on purpose. The tree checks and the self-tests run in
    # their own jobs, and `cargo xtask ci` would run all three sets a
    # third time; xtask is the local entry point, not a CI wrapper.
    name: rust
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag. A tag is mutable by whoever owns
      # the action, so `@v4` is a promise from a third party rather than
      # a fact about what runs. This SHA is actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Installs exactly what rust-toolchain.toml pins, rustfmt and
      # clippy included. The runner's preinstalled toolchain is whatever
      # the image was built with, which is the floating compiler the pin
      # exists to avoid.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes tests/support's fixture-loading suite, which is the
      # Stage-0 gate that the frozen vectors load from Rust with no
      # product networking in the graph.
      - name: Tests
        run: cargo test --workspace --all-targets

  tree-checks:
    name: tree checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag. A tag is mutable by whoever owns
      # the action, so `@v4` is a promise from a third party rather than
      # a fact about what runs. This SHA is actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # check_license_headers.sh and validate_adr_index.sh read the
          # working tree, not history — but scan_semantic_collisions.sh
          # is about what a merge produced, so the merge commit the queue
          # builds must be the tree under test. Default depth is enough
          # for that; full history is not needed.
          fetch-depth: 1

      - name: Install validator dependencies
        run: |
          # --require-hashes: every distribution is verified against
          # tools/requirements.txt, and pip refuses the install if any
          # package in the resolved set is unpinned. A guard that
          # recomputes a frozen vector is only as trustworthy as the
          # library that recomputed it.
          python3 -m pip install --quiet --require-hashes -r tools/requirements.txt

      - name: ADR index, template, and amendment record
        run: bash tools/checks/validate_adr_index.sh

      - name: Semantic collisions between parallel branches
        run: bash tools/checks/scan_semantic_collisions.sh

      - name: Licence headers and foreign licence terms
        run: bash tools/checks/check_license_headers.sh

      - name: Stage status agrees across the tree
        run: bash tools/checks/check_stage_status.sh

      - name: Wire contracts — schema, manifest, provenance
        run: python3 tools/checks/validate_contracts.py

      - name: Frozen fixture vectors recompute
        run: python3 tools/checks/verify_fixture_vectors.py

      - name: Markdown links resolve and YAML parses
        run: python3 tools/checks/check_docs_integrity.py

      - name: Every guard is reachable from a workflow
        run: bash tools/checks/check_guards_are_wired.sh

  tool-suites:
    name: tool self-tests
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag. A tag is mutable by whoever owns
      # the action, so `@v4` is a promise from a third party rather than
      # a fact about what runs. This SHA is actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # A self-test runs the real script, so this job needs whatever the
      # scripts need — the same list as tree-checks, not a shorter one.
      # Installing it only there would leave `tool-suites` passing on a
      # runner image that happens to ship the module and failing on one
      # that does not, which is the least debuggable form of green.
      - name: Install validator dependencies
        run: |
          # --require-hashes: every distribution is verified against
          # tools/requirements.txt, and pip refuses the install if any
          # package in the resolved set is unpinned. A guard that
          # recomputes a frozen vector is only as trustworthy as the
          # library that recomputed it.
          python3 -m pip install --quiet --require-hashes -r tools/requirements.txt

      # The suites mock `gh` and `curl` on PATH, so no token and no
      # network are used. They do need jq and coreutils `timeout`, both
      # present on ubuntu-latest.
      - name: Run every self-test beside its script
        run: |
          set -uo pipefail
          failed=0
          for t in tools/gh/test_*.sh tools/checks/test_*.sh; do
            printf '::group::%s\n' "$t"
            if bash "$t"; then
              printf '::endgroup::\n'
            else
              printf '::endgroup::\n'
              printf '::error file=%s::%s failed\n' "$t" "$t"
              failed=1
            fi
          done
          exit "$failed"
