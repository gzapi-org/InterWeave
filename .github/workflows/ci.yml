# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Andrea Benetton
#
# Everything in tools/ runs here, because a check that runs only when
# someone remembers is not a check. Ten self-test suites and five tree
# checks existed for a while with nothing invoking them.
#
# TWO THINGS ABOUT THIS FILE ARE LOAD-BEARING AND EASY TO BREAK:
#
#   1. `merge_group` is NOT optional. `main` is behind a merge queue, and
#      the queue builds its own ref — a workflow that triggers only on
#      `pull_request` never reports for that build, so every required
#      check sits "expected" and the queue waits forever. That is the
#      exact stall wait-merged.sh exit 6 was written to name.
#
#   2. A job's `name:` IS its required-check context. Renaming a job
#      silently un-gates `main`: the ruleset keeps requiring a context
#      that no longer exists, and nothing reports it, so the queue hangs
#      the same way. Rename a job only together with the ruleset
#      (CLAUDE.md §9). ADDING a job has the mirror-image failure: the
#      job runs, reports, and gates nothing at all until its name is
#      added to the ruleset's required_status_checks.
#
# Contexts reported here: `rust`, `tree checks`, `tool self-tests`.
#
# Deliberately NOT conditional-per-surface. The run is ~8.5 minutes wall
# clock, and all of it is `rust` (tree checks and tool self-tests ~2.7
# min each, in parallel beside it; 12 runs, 2026-09-29), which every PR
# that touches a crate needs anyway. A `changes` job and per-surface
# `run` inputs would skip only the two short jobs, and on a public
# repository the minutes cost nothing: machinery that costs more to
# understand than the runners it saves.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR: a superseded push has nothing to say. Never cancel a
  # merge-queue build (the queue is waiting on its result) or a push to
  # main, and a shared group would: even without cancel-in-progress a
  # group keeps ONE pending run, so a third push to main cancels the
  # second's. Every non-PR run is its own group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each tool's pin lives HERE, once — cargo-deny's and shellcheck's — because
# two jobs install each of them and a version bumped in one place only would
# leave the self-tests exercising a different binary from the checks — green
# for a reason nobody could see.
env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  # Pinned for the same reason, and with a sharper one: shellcheck's
  # SEVERITY CLASSIFICATION is a property of the release. A runner-image
  # bump that promoted any currently-`info` code to `warning` would turn a
  # required context red on a PR whose diff explains nothing — SC2015 is
  # the obvious candidate, 158 sites on 0.11.0, the assertion idiom most
  # self-tests under tools/checks/ are built from — and would fail the guard's own self-test
  # in the same run. Taking it from
  # whatever the image ships would also let the severity classification
  # the self-test pins vary by runner image. 0.11.0 is what Fedora 43
  # packages, so a developer's
  # `dnf install ShellCheck` and CI agree.
  SHELLCHECK_VERSION: "v0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # And cargo-machete's, for the same split: tree-checks runs the guard,
  # tool-suites its self-test, and both must judge with one release.
  CARGO_MACHETE_VERSION: "v0.9.2"
  CARGO_MACHETE_SHA256: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"

jobs:
  rust:
    # CONTEXT NAME: `rust`. Like the two below, this string is what the
    # ruleset requires — see the note above before touching it.
    #
    # Cargo-only on purpose. The tree checks and the self-tests run in
    # their own jobs, and `cargo xtask ci` would run all three sets a
    # third time; xtask is the local entry point, not a CI wrapper.
    name: rust
    runs-on: ubuntu-latest
    # Measured 8.5 min over 12 runs, 2026-09-29 (clippy 74 s, test build
    # 177 s, 104 test binaries ~215 s); the cap is for a hang, which
    # otherwise runs to GitHub's six-hour default.
    timeout-minutes: 25
    steps:
      # Pinned to a commit, not a tag. A tag is mutable by whoever owns
      # the action, so `@v7` is a promise from a third party rather than
      # a fact about what runs. The release goes in a comment ON THE SAME
      # LINE, so a reader sees which release runs: Dependabot rewrites a
      # comment there together with the SHA, and one on a line of its own
      # goes stale on the first update (check_actions_pinned_by_sha.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs exactly what rust-toolchain.toml pins, rustfmt and
      # clippy included. The runner's preinstalled toolchain is whatever
      # the image was built with, which is the floating compiler the pin
      # exists to avoid.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        # `--locked` so CI validates the COMMITTED resolution. Without
        # it a manifest change with a stale lockfile lets cargo rewrite
        # the lockfile in the runner, and the graph that was tested is
        # then one no commit contains.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # mdns_bounds.rs re-executes each test inside `unshare -rn` (a user
      # plus network namespace, no root) and builds a dummy multicast
      # interface there; ADR-0053 rule 9 makes it FAIL where that is
      # impossible, never skip. The hosted Ubuntu 24.04 image restricts
      # unprivileged user namespaces through AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), and `unshare -r`
      # then cannot write its uid map: "write failed /proc/self/uid_map:
      # Operation not permitted". Measured on ubuntu-latest (kernel
      # 6.17.0-azure, 2026-09-25): that failure before this step, the five
      # tests green after it, with default threads and with one. A dummy
      # link needs no `modprobe` there — measured too, so none is added.
      # The last line builds one interface the way the test does, so a
      # runner-image change fails HERE, named, not as five test failures.
      - name: Allow unprivileged user namespaces (mdns_bounds)
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare -rn sh -c 'ip link add probe0 type dummy && ip link set probe0 up && ip link show probe0'

      # Includes tests/support's fixture-loading suite, which is the
      # Stage-0 gate that the frozen vectors load from Rust with no
      # product networking in the graph.
      - name: Tests
        run: cargo test --workspace --all-targets --locked

      # After Tests, so the listing reuses the binary it built.
      - name: The root funnel's measurement tests are compiled and not ignored (plan §15)
        run: bash tools/checks/check_root_funnel_precondition.sh --compiled

      - name: The lockfile is the one that was committed
        # Belt and braces to `--locked`: if any step did rewrite it, say
        # so here rather than letting a green run attest to a graph the
        # commit does not carry.
        run: git diff --exit-code -- Cargo.lock

  tree-checks:
    name: tree checks
    runs-on: ubuntu-latest
    # Measured 2.7 min over 12 runs, 2026-09-29; the cap is for a hang,
    # which otherwise runs to GitHub's six-hour default.
    timeout-minutes: 15
    # What the cargo cache holds, once, for the restore and the save.
    env:
      CARGO_CACHE_PATHS: |
        ~/.cargo/registry
        ~/.cargo/git
        ~/.rustup
        spikes/spike-002/harness/target
        spikes/spike-003/harness/target
        spikes/spike-004/harness/target
    steps:
      # Pinned to a commit, for the reason given in the `rust` job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_license_headers.sh and validate_adr_index.sh read the
          # working tree, not history — but scan_semantic_collisions.sh
          # is about what a merge produced, so the merge commit the queue
          # builds must be the tree under test.
          #
          # FULL HISTORY, because check_spike_locks.sh's provenance phase
          # asks where each spike pin came from: whether it is an
          # ancestor of origin/main, and which commit in that spike's
          # history points at it. A pinned revision is an ordinary commit
          # object, so a depth-1 clone cannot answer either question —
          # the guard says so and exits 2 rather than passing, which
          # would turn this job red on every run.
          fetch-depth: 0

      - name: Install validator dependencies
        run: |
          # --require-hashes: every distribution is verified against
          # tools/requirements.txt, and pip refuses the install if any
          # package in the resolved set is unpinned. A guard that
          # recomputes a frozen vector is only as trustworthy as the
          # library that recomputed it.
          python3 -m pip install --quiet --require-hashes -r tools/requirements.txt

      - name: ADR index, template, and amendment record
        run: bash tools/checks/validate_adr_index.sh

      - name: Semantic collisions between parallel branches
        run: bash tools/checks/scan_semantic_collisions.sh

      - name: Licence headers and foreign licence terms
        run: bash tools/checks/check_license_headers.sh

      - name: Stage status agrees across the tree
        run: bash tools/checks/check_stage_status.sh

      - name: Component READMEs agree with their own directories
        run: bash tools/checks/check_component_status.sh
      - name: Discovery schema config keys are representable
        run: bash tools/checks/check_discovery_config_keys.sh
      - name: Example profiles satisfy the enforced bounds
        run: bash tools/checks/check_example_profiles.sh

      - name: Required check contexts match the workflow's job names
        run: bash tools/checks/check_required_contexts.sh

      # A domain function nothing calls is a rule that binds nothing, and
      # its own green unit tests are what make it look covered. Stage 6
      # shipped two that way and both came back as P1 findings.
      - name: Every public domain function has a caller
        run: bash tools/checks/check_domain_fns_are_called.sh

      # Plan §16's D3. An inventory of the schema directory names every
      # schema the moment it exists, so the guard does not count one.
      - name: Every IPC schema is named by a test
        run: bash tools/checks/check_ipc_schemas_are_tested.sh

      # THE FIRST CARGO IN THIS JOB IS BELOW, so the cache goes here and
      # not beside the step that pays most for it. Before this, the job
      # had no cargo cache at all — every run re-downloaded the registry
      # and rebuilt each spike harness from nothing.
      #
      # Keyed on the harness LOCK FILES, which carry the pinned revisions
      # of this repository's own crates: a pin that moves changes the
      # lock, which changes the key, which is exactly when the rebuild
      # should be paid. `restore-keys` on the prefix means an unrelated
      # lock change warms from the previous build rather than starting
      # cold; cargo rebuilds only what actually differs.
      #
      # Measured at `cargo -j 2` on the author's host: 54.5 s cold for one
      # harness, 1.6 s warm for three. The cold figure is paid once per
      # lock change rather than once per push.
      #
      # `~/.rustup` is in the cache because this job installs no
      # toolchain of its own, unlike `rust` above. The spike harnesses
      # sit under the repository root, so rustup's toolchain-file walk-up
      # reaches `rust-toolchain.toml` and the first `cargo` here
      # auto-downloads the pinned channel — every run, uncached, which
      # would eat most of what this cache saves (review, PR #110; raised
      # as a risk rather than a measurement, and not yet timed on a
      # runner). So `rust-toolchain.toml` is in the KEY as well: keyed on
      # the locks alone, a channel bump restores the old toolchain on an
      # exact hit, downloads the new one, and never saves it, because a
      # hit does not re-save. The 1.98.1 bump would have paid that on
      # every run until a lock happened to change.
      #
      #
      # RESTORED EVERYWHERE, SAVED ONLY FROM main (the last step of this
      # job). A cache saved by a pull request or a queue build is scoped to
      # that ref and no other run can read it, while main's is readable by
      # all: on 2026-09-29, 7 of the 8 tree-checks caches (~8.3 GB) sat on
      # pull/ and queue refs, holding the repository at its 10 GB limit and
      # evicting main's.
      #
      # Pinned to a commit for the reason given in the `rust` job.
      - name: Restore the cargo registry and the spike harness builds
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: tree-checks-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'spikes/*/harness/Cargo.lock') }}
          restore-keys: |
            tree-checks-cargo-${{ runner.os }}-

      # cargo-deny cannot catch this one: yamux has no RustSec advisory,
      # so the dependency check below reports clean and always will.
      - name: No first-party source selects the vulnerable yamux muxer
        run: bash tools/checks/check_yamux_muxer.sh

      # Plan §15 / ADR-0052 rule 5: Stage 12 may compose kademlia, the
      # relay client or the authorised-identify opt-ins only while the root
      # funnel's measurement is committed as a test and runs. The relay
      # client is on in every valid profile, so this binds unconditionally.
      - name: The root funnel's test file is present and CI runs cargo test --all-targets (plan §15)
        run: bash tools/checks/check_root_funnel_precondition.sh

      # A spike harness is its own workspace. It used to path-depend on
      # production crates, which inherit `libp2p` from the ROOT manifest,
      # so a change here re-resolved a build over there while the
      # committed lock stayed as it was — and `cargo run` rewrites the
      # lock rather than complaining. They now pin this repository's
      # crates BY REVISION, which removes that drift; `--locked` is what
      # checks the pinning still holds.
      #
      # AND THE LOCK IS NOT THE WHOLE QUESTION. `cargo metadata` resolves
      # a graph without type-checking it, so a harness pinned at a
      # revision missing an API its source imports resolved cleanly and
      # did not compile — SPIKE-004, across two stages, until a review
      # found it. The guard runs `cargo check --locked` per harness too,
      # which is what the cache above is for.
      - name: Every committed spike lock still resolves and type-checks
        run: bash tools/checks/check_spike_locks.sh

      # `profile-config` is a neutral contract crate and may not depend on
      # libp2p, so it cannot read the feature array that decides whether a
      # host it refuses is one this build can dial. Nothing else would
      # notice when the two stop agreeing.
      - name: The manifest's libp2p features and profile-config's dialable hosts agree
        run: bash tools/checks/check_dialable_hosts.sh

      # Shell got the reviewer's eye and no check at all until this, while
      # Rust gets `clippy -D warnings`.
      #
      # INSTALLED FROM A PINNED TARBALL rather than taken from the runner
      # image, the same discipline as cargo-deny above and for a reason
      # specific to this tool: severity classification belongs to the
      # release, so an image bump could turn this required context red
      # with nothing in the diff to explain it.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${SHELLCHECK_SHA256}  ${asset}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xJf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/shellcheck" --version

      # The guard exits 2 rather than 0 when shellcheck is absent, so a
      # failed install above surfaces here as a refusal and never as a
      # silent skip.
      - name: Every tracked shell script passes shellcheck
        run: bash tools/checks/check_shell_scripts.sh

      # A tag is a pointer the action's owner can move; a pin without its
      # release on the same line says nothing about which release runs.
      - name: Every third-party action is pinned by commit SHA, its release beside it
        run: bash tools/checks/check_actions_pinned_by_sha.sh

      # Also outside cargo-deny's reach: this is a property of a
      # dependency's internals, which no version pin describes.
      - name: GossipSub still refuses invalid signatures during decode
        run: bash tools/checks/check_gossipsub_rejects_bad_signatures_at_decode.sh

      # Installed from the upstream release binary, verified by checksum,
      # rather than through a third-party action.
      #
      # Two reasons. A `cargo install` compiles cargo-deny and its own
      # dependency tree on every run, which is minutes; and an action to
      # run a supply-chain check adds a supply-chain dependency that the
      # check itself would not cover. A pinned tarball with a known
      # sha256 is the same discipline this repository applies to its pip
      # dependencies, applied to its own tooling.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${CARGO_DENY_SHA256}  ${asset}" | sha256sum --check --strict
          # A directory this job creates, rather than /usr/local/bin.
          # Writing there works on today's ubuntu-latest image — the runs
          # prove it — but only because that image happens to leave it
          # writable by the unprivileged runner user, which GitHub does
          # not document or guarantee. An image change would break both
          # required jobs at once, and the failure would look like a
          # dependency problem rather than an install one.
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/cargo-deny" --version

      - name: Dependency policy — advisories, licences, bans, sources
        run: bash tools/checks/check_dependencies.sh

      # Must follow the step above: it needs the same cargo-deny, and it
      # covers the crates that one structurally cannot see (ADR-0051).
      #
      # THIS STEP ASKS THE CRATES.IO INDEX, which the step above does not:
      # it resolves each vendored crate from the registry before running the
      # advisory check. A registry outage therefore reds this required
      # context on every pull request in the queue with nothing in any diff
      # to explain it. That is the accepted cost of refusing a silent skip,
      # and the guard's `--help` says what an operator should do.
      #
      # The ADVISORY DATABASE is not new here -- the dependency-policy step
      # above already fetches it and already treats a fetch failure as an
      # environment problem -- so on a RustSec outage that step reds first.
      - name: RustSec advisories for vendored crates
        run: bash tools/checks/check_vendored_advisories.sh

      # A pinned release tarball, like cargo-deny above and for the same
      # reasons. The guard, not the tool, is the step: it judges only the
      # workspace members (the spikes and third_party/ are not ours to
      # prune) and turns cargo-machete's silent fallback into exit 2.
      - name: Install cargo-machete
        run: |
          set -euo pipefail
          asset="cargo-machete-${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/bnjbvr/cargo-machete/releases/download/${CARGO_MACHETE_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${CARGO_MACHETE_SHA256}  ${asset}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "cargo-machete-${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/cargo-machete" --version

      - name: Every workspace member uses the dependencies it declares
        run: bash tools/checks/check_unused_dependencies.sh

      - name: Wire contracts — schema, manifest, provenance
        run: python3 tools/checks/validate_contracts.py

      - name: Frozen fixture vectors recompute
        run: python3 tools/checks/verify_fixture_vectors.py

      - name: Markdown links resolve and YAML parses
        run: python3 tools/checks/check_docs_integrity.py

      - name: Every guard is reachable from a workflow
        run: bash tools/checks/check_guards_are_wired.sh

      # Last, so it saves what every cargo step above built; only from a
      # push to main, and not on an exact hit, which has nothing new.
      - name: Save the cargo cache (main only)
        if: success() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  tool-suites:
    name: tool self-tests
    runs-on: ubuntu-latest
    # Measured 2.6 min over 12 runs, 2026-09-29; the cap is for a hang,
    # which otherwise runs to GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      # Pinned to a commit, for the reason given in the `rust` job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A self-test runs the real script, so this job needs whatever the
      # scripts need — the same list as tree-checks, not a shorter one.
      # Installing it only there would leave `tool-suites` passing on a
      # runner image that happens to ship the module and failing on one
      # that does not, which is the least debuggable form of green.
      - name: Install validator dependencies
        run: |
          # --require-hashes: every distribution is verified against
          # tools/requirements.txt, and pip refuses the install if any
          # package in the resolved set is unpinned. A guard that
          # recomputes a frozen vector is only as trustworthy as the
          # library that recomputed it.
          python3 -m pip install --quiet --require-hashes -r tools/requirements.txt

      # test_check_dependencies.sh degrades to an absence-path-only run
      # when cargo-deny is missing, and reports success. That is right for
      # a developer laptop and wrong for CI, where it would quietly stop
      # exercising the policy at all.
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${CARGO_DENY_SHA256}  ${asset}" | sha256sum --check --strict
          # A directory this job creates, rather than /usr/local/bin.
          # Writing there works on today's ubuntu-latest image — the runs
          # prove it — but only because that image happens to leave it
          # writable by the unprivileged runner user, which GitHub does
          # not document or guarantee. An image change would break both
          # required jobs at once, and the failure would look like a
          # dependency problem rather than an install one.
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/cargo-deny" --version

      # THE SAME PIN HERE, because this job is where
      # `test_check_shell_scripts.sh` runs, and jobs share no installed
      # tools. Installed only in tree-checks, the self-test judged the
      # guard against whatever shellcheck the runner image bundles -- a
      # different release from the one the guard runs under, which is the
      # split the cargo-deny comment above exists to prevent -- and an
      # image that stopped bundling it would have turned `tool self-tests`
      # red with nothing in the diff to explain it. Both reviewers on
      # PR #82 found this independently.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          asset="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${SHELLCHECK_SHA256}  ${asset}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xJf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/shellcheck" --version

      # The same pin again, for `test_check_unused_dependencies.sh`, by the
      # shellcheck comment's reasoning: jobs share no installed tools.
      - name: Install cargo-machete
        run: |
          set -euo pipefail
          asset="cargo-machete-${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/bnjbvr/cargo-machete/releases/download/${CARGO_MACHETE_VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          echo "${CARGO_MACHETE_SHA256}  ${asset}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$asset" --strip-components=1 -C "${RUNNER_TEMP}/bin" \
            "cargo-machete-${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/cargo-machete" --version

      # The `gh` suites mock `gh` and `curl` on PATH, so no token is used.
      # They do need jq and coreutils `timeout`, both present on
      # ubuntu-latest. `test_check_vendored_advisories.sh` is the one
      # suite that reaches the crates.io INDEX -- it resolves fixtures
      # from the registry at exact versions, because the guard it tests
      # cannot be exercised without that. It fetches the advisory
      # database too, but it is NOT the only suite that does:
      # `test_check_dependencies.sh` runs `cargo deny check`, which
      # includes advisories, and names an unreachable database as its own
      # exit-2 cause. An earlier version of this said "the one suite that
      # DOES reach the network", which was false about its neighbour --
      # and `check_vendored_advisories.sh` already carried that very
      # correction, so this was the stale half of a corrected pair.
      # Review finding on PR #85. It skips rather than fails
      # when either is unreachable, except under `CI`, where both are
      # installed on purpose and a skip would mean the job stopped
      # exercising the guard.
      - name: Run every self-test beside its script
        run: |
          set -uo pipefail
          failed=0
          for t in tools/gh/test_*.sh tools/checks/test_*.sh; do
            printf '::group::%s\n' "$t"
            if bash "$t"; then
              printf '::endgroup::\n'
            else
              printf '::endgroup::\n'
              printf '::error file=%s::%s failed\n' "$t" "$t"
              failed=1
            fi
          done
          exit "$failed"
