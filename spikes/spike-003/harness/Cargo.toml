#
# SPIKE-003 harness — EVIDENCE ONLY, and deliberately not a workspace
# member. Nothing depends on it, and its results reach production as
# permanent tests rather than as code (CLAUDE.md §4, spikes/README.md).
#
# Staying outside the workspace is what KEPT `kad` off the production
# feature list. Cargo unifies features across one build of one
# workspace, so as a member this harness would have switched Kademlia on
# inside `interweave-transport-libp2p` — undoing CLAUDE.md §3's "absent
# from the feature list rather than merely unused", and doing it
# invisibly, because nothing in the production crate would have changed.
# That rule is the whole reason this spike ran BEFORE Stage 10 rather
# than during it.
#
# 2026-09-08: `kad` has been production's since Stage 10 and Stage 11
# added `autonat`, `relay` and `dcutr`, so nothing is being held back
# here any more. The dependency now runs the OTHER way — this harness
# path-depends on the production crate, which declares
# `libp2p = { workspace = true }` and so resolves against the ROOT
# manifest wherever it is built, including from inside this workspace.
# (Inheritance, not feature unification, which does not cross a
# workspace boundary.) That is why the committed lock had to be
# regenerated when those three landed.
#
# An EMPTY workspace table is what keeps it out: the package is its own
# workspace root, so it is never built by `cargo xtask ci`, never enters
# the root `Cargo.lock`, and is one deliberate `path =` away from
# production rather than one accident away.
[workspace]

[package]
name = "spike-003-harness"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[dependencies]
# PINNED TO WHAT THE PRODUCT RESOLVES, with the lock committed beside
# it. `kad` is the one spike-only FEATURE; every version below is the
# one the root Cargo.lock resolves today. A floating "0.56" resolves a
# later patch, and half of what this spike records — implicit bootstrap
# on routing insertion, mode advertisement, query event ordering — is
# exactly what a patch release may change. A result that cannot be
# rebuilt is not evidence.
libp2p = { version = "=0.56.0", default-features = false, features = [
    "tcp",
    "noise",
    "yamux",
    "identify",
    "tokio",
    "macros",
    "ed25519",
    "kad",
] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "=0.3.34"
sha2 = "=0.10.9"

# THE PRODUCTION DIAL GATE, by path and on purpose. The question this
# spike exists to answer is whether Kademlia-originated dials are
# subject to the root admission, and measuring a copy of the gate would
# measure a copy. The dependency runs spike -> product, which is the
# direction CLAUDE.md §4 permits; the reverse is what it forbids.
# BY REVISION, NOT BY PATH -- 9547a5b, the PARENT of 2ddb41d, the last
# commit that records a run of this harness ("setup dials do not cross
# admission, stated honestly", 2026-08-31).
#
# THE PIN IS THE TREE THE RUN BUILT AGAINST, and the derivation starts
# from THIS SPIKE'S HISTORY -- the last commit whose message records a
# run -- never from a date and never from the pin being replaced
# (`SPIKES.md` preamble; architect-cto, cd9ef79 and c2f8c0b). Two
# shapes: a recording commit that changes no production crate points at
# its PARENT, which is this one; one that also changes a crate points
# at itself, because the run measured the code it landed with.
#
# THE PREVIOUS PIN, db798e2d, CAME FROM THE VERDICT'S DATE and was
# wrong for the reason a date always is: a run is recorded on a branch,
# and `main`'s head on the verdict's day is not the tree the run built
# against. It was the parent of no commit touching only this spike --
# which is what `check_spike_locks.sh`'s provenance phase now refuses,
# and how this was caught (review, PR #110).
#
# WHY 2ddb41d AND NOT THE LATER TWO, since both touch only this spike:
# 817b252 (09-06) is a dated note on the record and says in its own
# message that it is "a dated note, not a rewrite". fdc838b (09-08)
# regenerates the lock the features-on change invalidated; what it
# verified is `cargo metadata --locked` exiting 101 before and 0 after,
# which is the LOCK and not the harness, and its own README text says
# of the three new behaviours "None of the three was measured here --
# they entered the graph after the fact". Neither ran the experiments.
# 4d2b062 (08-30) did, but 2ddb41d is later.
#
# THE VERDICT LINE KEEPS ITS OWN DATE, 2026-08-30. A pin follows the
# record's last run; a verdict is evidence about the day it was taken.
#
# REPRODUCED 2026-09-20 AT THIS PIN: all observations held, 29
# experiments, 202 checks. That run is the PROOF; compiling is only
# necessary. A pin that compiles and fails a recorded row is the wrong
# tree, which is what the previous pin of SPIKE-004 was, and no
# `cargo check` can tell the two apart.
#
# A path dependency follows the tree, so a root-manifest bump drags
# today's libp2p into a graph pinned at the version measured: the
# harness then resolves two libp2p majors at once and reproduces
# nothing. A rev gives the real production crates AS THEY WERE --
# vendoring or dropping them would make this measure a COPY of the
# gate, which was the subject. Ruled by architect-cto, 2026-09-19; a
# finding that must keep holding belongs in the production test suite,
# not in a re-run of this harness.
interweave-transport-libp2p = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "9547a5b1e834d1b3c94b16307a3ebb7f70d913f9" }
interweave-transport-runtime = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "9547a5b1e834d1b3c94b16307a3ebb7f70d913f9" }
interweave-transport-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "9547a5b1e834d1b3c94b16307a3ebb7f70d913f9" }
interweave-trust-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "9547a5b1e834d1b3c94b16307a3ebb7f70d913f9" }
