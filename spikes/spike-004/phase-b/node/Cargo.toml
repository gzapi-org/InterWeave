#
# SPIKE-004 phase B's node: the shipping substrate, in a container behind
# the NAT matrix `../topology.sh` builds.
#
# ITS OWN WORKSPACE, like every spike harness: a spike never becomes a
# production dependency, and the root workspace never builds it.
#
# THE WORKSPACE'S CRATES ARE TAKEN BY REVISION, not by path. Phase B is
# under the release-gate regime (`architecture/roadmap/SPIKES.md`'s
# preamble): the claim is about what ships, so the node runs the
# substrate at a named revision, and that pin moves only in the change
# that re-runs the rows and re-records them -- never in a bump by
# itself. A path dependency would follow the tree instead.
#
# THE PIN: 36fd72a2, recorded by the commit that added
# REPRODUCTION-2026-09-26-rebuild.log (the `early` and `ifchange` rows,
# beside ../nodes.sh), of which it is the parent. The rows recorded in
# REPRODUCTION-2026-09-26.log ran at the previous pin, 6500391e.
# `Cargo.lock` is the root lock at the pin, plus only this package and
# `signal-hook-registry`: seeded from it, not resolved fresh, so the graph
# is the shipping one (a fresh resolve had drifted yamux among forty).
#
# THE PATCH TABLE IS NOT OPTIONAL. The root workspace builds
# `libp2p-autonat` and `libp2p-mdns` from `third_party/` (ADR-0051,
# ADR-0053) through its own `[patch.crates-io]`, and a patch applies only
# in the workspace that declares it: without this one the node would
# build the RELEASED crates -- no `Behaviour::retest`, no store caps --
# and would not be the substrate at all. Same repository, same revision.

[workspace]

[package]
name = "spike-004-phase-b-node"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "node"
path = "src/main.rs"

[dependencies]
interweave-transport-libp2p = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
interweave-transport-runtime = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
interweave-transport-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
interweave-trust-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
interweave-profile-identity = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
libp2p = { version = "=0.57.0", default-features = false }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[patch.crates-io]
libp2p-autonat = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
libp2p-mdns = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "36fd72a2dbb4a4bc2782c65a1ea1d80c1bbc9e65" }
