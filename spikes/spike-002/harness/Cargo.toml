#
# SPIKE-002 harness — EVIDENCE ONLY, and deliberately not a workspace
# member. Nothing depends on it, and its results reach production as
# permanent tests rather than as code (CLAUDE.md §4, spikes/README.md).
#
# Staying outside the workspace matters MORE here than it did for
# SPIKE-006, and not only for the reasons that applied there. This
# harness enables `request-response` and `gossipsub` on the same
# `libp2p` dependency the substrate uses, and Cargo unifies features
# across one build of one workspace. As a member, it would switch both
# protocols on inside `interweave-transport-libp2p` — undoing the whole
# point of CLAUDE.md §3's "absent from the feature list rather than
# merely unused", and doing it invisibly, because nothing in the
# production crate would have changed.
#
# An EMPTY workspace table is what keeps it out: the package is its own
# workspace root, so it is never built by `cargo xtask ci`, never enters
# the root `Cargo.lock`, and is one deliberate `path =` away from
# production rather than one accident away.
[workspace]

[package]
name = "spike-002-harness"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[dependencies]
# 0.56, because that is what the substrate ships. A spike measuring a
# version the product does not use measures nothing (SPIKE-006 learned
# this the expensive way, having first been run against a version the
# substrate could not have linked).
#
# `request-response` and `gossipsub` are the two subjects. They are
# absent from the production feature list and must stay absent until
# Stage 6 and Stage 7 open respectively.
# PINNED TO WHAT THE PRODUCT RESOLVES, and the lock is committed
# beside it. Not merely "pinned": the async graph underneath is part of
# what A5 and A8 measure -- timeout attribution is a race between two
# executors and cancellation is a stream-teardown ordering, so a spike
# running a different tokio or futures is measuring a different
# scheduler than the one that ships. Every version below is the one the
# root Cargo.lock resolves; the spike-only additions are libp2p
# FEATURES, not different versions.
# A floating
# `"0.56"` resolves a later patch release, and the two findings this
# spike records -- duplicate-cache ordering and timeout attribution --
# are precisely the kind of behaviour a patch release may change. A
# result that cannot be rebuilt is not evidence.
libp2p = { version = "=0.56.0", default-features = false, features = [
    "tcp",
    "noise",
    "yamux",
    "identify",
    "tokio",
    "macros",
    "ed25519",
    "request-response",
    "gossipsub",
    "cbor",
] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
# THE EXACT ENCODER the request-response CBOR codec uses -- already in
# this graph as its transitive dependency, pinned to the same version,
# so no licence or advisory surface is added. A9 compares the ENCODED
# bytes of five refusals; encoding them with a different library would
# compare something the wire never sees.
cbor4ii = { version = "=0.3.3", features = ["use_std", "serde1"] }

# The PRODUCTION dedup and reservation machinery, by path and on purpose.
# The question this spike asks about concurrency is whether those exact
# structures survive the real request-response scheduler, so measuring a
# copy of them would measure a copy. The dependency runs spike -> product,
# which is the direction CLAUDE.md §4 permits; the reverse is what it
# forbids.
# BY REVISION, NOT BY PATH -- 94f72cc, the tree the last recorded runs
# built against: the production commit the five spike-only commits of
# 2026-08-25 sit on, ending at fdab2cb ("A8's gate accepts only
# ConnectionClosed, not any inbound failure").
#
# THE PIN IS THE TREE THE RUN BUILT AGAINST, and the derivation starts
# from THIS SPIKE'S HISTORY -- the last commit whose message records a
# run -- never from a date (`SPIKES.md` preamble; architect-cto,
# cd9ef79 and c2f8c0b). Two shapes: a recording commit that changes no
# production crate points at its PARENT, one that also changes a crate
# points at itself. Here the recordings are a RUN of five such commits
# in a row, so each one's parent is the previous recording rather than
# a production tree; the crates they all resolved by path are the
# chain's base, which is this pin.
#
# THE PREVIOUS PIN, 739fee11, CAME FROM THE VERDICT'S DATE, and it was
# not merely imprecise: it is the parent of 061676d, the commit that
# CREATED this harness on 08-23, while the runs recorded below are from
# 08-25. The production crates differ across that gap by 2,780 lines in
# 8 files -- `connection_manager.rs` by 1,238 and `runtime.rs` by 641 --
# so the old pin rebuilt a graph the evidence never saw. Measured with
# `git diff --stat 739fee11 94f72cc -- crates/` (review, PR #110).
#
# REPRODUCED 2026-09-20 AT THIS PIN: every required observation held.
# That run is the PROOF; compiling is only necessary. The old pin
# compiled too -- which is exactly why a green `cargo check` is not an
# answer, and why `check_spike_locks.sh` passing a pin does not make it
# the right one.
#
# A path dependency follows the tree, so a root-manifest bump drags
# today's libp2p into a graph pinned at the version measured: the
# harness then resolves two libp2p majors at once and reproduces
# nothing. A rev gives the real production crates AS THEY WERE --
# vendoring or dropping them would make this measure a COPY of the
# structures under test, which was the subject. Ruled by architect-cto,
# 2026-09-19; a finding that must keep holding belongs in the
# production test suite, not in a re-run of this harness.
interweave-transport-runtime = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "94f72cc4e42a53992c0d9f444eb7882f94695ab6" }
interweave-transport-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "94f72cc4e42a53992c0d9f444eb7882f94695ab6" }
