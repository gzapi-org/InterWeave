# Copyright 2026 Andrea Benetton
#
# SPIKE-008 device harness, Rust core -- EVIDENCE ONLY, and deliberately
# not a workspace member (an empty [workspace] table below), as every
# spike harness. Built for arm64-v8a with cargo-ndk and loaded over JNI
# by the harness app in ../app. It holds THE PRODUCTION HUMAN STORE, so
# what the device measures about retention and backup eligibility is the
# store's own behaviour on Android's filesystem, not a copy of its rules.

[package]
name = "spike-008-harness"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[lib]
name = "spike008"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact, the version the root Cargo.lock resolves; raw JNI, byte arrays
# and ints only.
jni-sys = "=0.3.1"

# THIS REPOSITORY, by revision (SPIKES.md, "frozen all the way down"):
# the tree the last recorded run built against. That run is part 6,
# REPRODUCTION-2026-10-07d.log, recorded by 9769076a; the pin is its
# parent, 03434804, the human store with secure_delete. Parts 1 to 5
# ran at d019ac06, the pin before this one.
interweave-human-store = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "034348048f548e208ed37ac4bcd08aba1e342a65" }
interweave-human-core = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "034348048f548e208ed37ac4bcd08aba1e342a65" }
# Exact, the root lock's version and features: `bench` times SQLite itself,
# the same bundled build the store runs, for the cost of the deletion rule.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
interweave-transport-api = { git = "https://github.com/gzapi-org/InterWeave.git", rev = "034348048f548e208ed37ac4bcd08aba1e342a65" }

[dev-dependencies]
# Exact, the root lock's version: the label test reads the JSON it checks.
serde_json = "=1.0.151"

[workspace]
