
# Standard-v1 Kademlia configuration. Kademlia is enabled by default/on purpose.
# A reduced/custom build without Kademlia support must reject this profile.
schema_version: 2
profile: { name: kademlia-ready }
transport:
  backend: libp2p
  connectivity:
    required: true
    infrastructure: { allowed_peers: [] }
    autonat:
      version: 2
      client: { enabled: true, static_servers: [] }
      server: { enabled: false }
    relay:
      client: { enabled: true, static_relays: [] }
      server: { enabled: false }
    dcutr: { enabled: true }
  listen:
    addresses: ["/ip4/0.0.0.0/tcp/4001"]
identity: {}
trust:
  policy: static-allowlist
  allowed_peers: ["<KAD_SERVER_A>", "<KAD_SERVER_B>", "<PEER_C>"]
endpoints:
  registration_policy: configured-only
  default_direct_endpoint: claude
  directory: { enabled: true, cache_ttl: 60s, max_advertised: 16 }
  entries:
    - id: claude
      enabled: true
      advertise: true
      allowed_client_kinds: [claude-channel]
      inbound: { policy: inherit-profile-trust, allowed_peers: [] }
      outbound: { policy: inherit-profile-trust, allowed_peers: [] }

discovery:
  providers:
    - type: peer-cache
      enabled: true
      priority: 10
      config: { ttl: 7d, max_entries: 1024 }
    - type: static-bootstrap
      enabled: true
      priority: 20
      config:
        peers:
          - "/dns4/kad-a.example.net/tcp/4001/p2p/<KAD_SERVER_A>"
          - "/dns4/kad-b.example.net/tcp/4001/p2p/<KAD_SERVER_B>"
    - type: kademlia
      enabled: true
      priority: 40
      config:
        config_version: 1
        network_id: "example-private-network"
        mode: client
        routing_peer_policy: data-plane-trusted
        seed_sources: [peer-cache, static-bootstrap]
        candidate_ttl: 30m
        kbucket_size: 20
        max_routing_peers: 256
        query_timeout: 30s
        parallelism: 3
        disjoint_query_paths: true
        max_concurrent_queries: 2
        max_queries_per_minute: 6
        exploration_interval: 60s
        exploration_jitter_percent: 20
        max_results_per_query: 20
        target_routing_peers: 64
        targeted_lookup_cooldown: 5m
        bootstrap_min_interval: 5m
        bootstrap_refresh_interval: 15m
        record_mode: disabled
channels:
  desired: ["project-alpha"]
