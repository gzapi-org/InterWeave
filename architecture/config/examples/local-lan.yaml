schema_version: 2
profile: { name: local-lan }
transport:
  backend: libp2p
  connectivity:
    required: true
    infrastructure: { allowed_peers: [] }
    autonat:
      version: 2
      client: { enabled: true, static_servers: [] }
      server: { enabled: false }
    relay:
      client: { enabled: true, static_relays: [] }
      server: { enabled: false }
    dcutr: { enabled: true }
  listen:
    addresses: ["/ip4/0.0.0.0/tcp/4001"]
identity: {}
trust:
  policy: static-allowlist
  allowed_peers:
    - "<PEER_ID_A>"
endpoints:
  registration_policy: configured-only
  default_direct_endpoint: claude
  directory: { enabled: true, cache_ttl: 60s, max_advertised: 16 }
  entries:
    - id: claude
      enabled: true
      advertise: true
      allowed_client_kinds: [claude-channel]
      inbound: { policy: inherit-profile-trust, allowed_peers: [] }
      outbound: { policy: inherit-profile-trust, allowed_peers: [] }

discovery:
  providers:
    - type: peer-cache
      enabled: true
      priority: 10
      config: { ttl: 7d, max_entries: 1024 }
    - type: mdns
      enabled: true
      priority: 20
      config: {}
channels:
  desired: ["project-alpha"]
