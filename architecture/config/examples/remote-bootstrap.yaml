schema_version: 2
profile: { name: remote }
transport:
  backend: libp2p
  connectivity:
    required: true
    infrastructure: { allowed_peers: [] }
    autonat:
      version: 2
      client: { enabled: true, static_servers: [] }
      server: { enabled: false }
    relay:
      client: { enabled: true, static_relays: [] }
      server: { enabled: false }
    dcutr: { enabled: true }
  listen:
    addresses: ["/ip4/0.0.0.0/tcp/4001"]
identity: {}
trust:
  policy: static-allowlist
  allowed_peers:
    - "<TRUSTED_REMOTE_PEER_ID>"
    - "<KAD_SERVER_A>"
    - "<KAD_SERVER_B>"
endpoints:
  registration_policy: configured-only
  default_direct_endpoint: claude
  directory: { enabled: true, cache_ttl: 60s, max_advertised: 16 }
  entries:
    - id: claude
      enabled: true
      advertise: true
      allowed_client_kinds: [claude-channel]
      inbound: inherit_profile_trust
      outbound: inherit_profile_trust

discovery:
  providers:
    - type: peer-cache
      enabled: true
      priority: 10
      config: { ttl: 7d, max_entries: 1024 }
    - type: static-bootstrap
      enabled: true
      priority: 30
      config:
        peers:
          - "/dns4/bootstrap-a.example.net/tcp/4001/p2p/<KAD_SERVER_A>"
          - "/dns4/bootstrap-b.example.net/tcp/4001/p2p/<KAD_SERVER_B>"
    - type: kademlia
      enabled: true
      priority: 40
      config:
        config_version: 1
        network_id: "remote-example"
        mode: client
        routing_peer_policy: data-plane-trusted
        seed_sources: [peer-cache, static-bootstrap]
        candidate_ttl: 30m
        kbucket_size: 20
        max_routing_peers: 256
        query_timeout: 30s
        parallelism: 3
        disjoint_query_paths: true
        max_concurrent_queries: 2
        max_queries_per_minute: 6
        exploration_interval: 60s
        exploration_jitter_percent: 20
        max_results_per_query: 20
        target_routing_peers: 64
        targeted_lookup_cooldown: 5m
        bootstrap_min_interval: 5m
        bootstrap_refresh_interval: 15m
        record_mode: disabled
channels:
  desired: ["build-events"]
# Bootstrap configuration does NOT grant trust. This example separately allowlists the two
# Kademlia server/bootstrap PeerIds because v1 will not dial an unauthorized data-plane peer.
# They must advertise the exact private Kademlia server protocol for DHT routing insertion.
# Allowlisting them permits connectivity/routing participation but grants no identity/membership authority.
