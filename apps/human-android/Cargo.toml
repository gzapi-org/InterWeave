#
# The Android human client (plan section 20): the native library the APK
# loads, the client's composition root on the phone, thin as the desktop
# one is. It names no Slint crate itself -- the toolkit is reached through
# ui-slint (the human-layering check, rule 4). The Gradle project that
# packages it is android/.
[package]
name = "interweave-human-android"
version = "0.0.0"
publish = false
description = "The InterWeave Android human client's native library."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "interweave_human_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
interweave-human-ui-model = { path = "../../crates/human/ui-model" }

[target.'cfg(target_os = "android")'.dependencies]
# The views with Slint's Android backend over NativeActivity.
interweave-human-ui-slint = { path = "../../crates/human/ui-slint", features = ["android"] }
