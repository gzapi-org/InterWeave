#
# OSV.dev suppressions for the Gradle graph (plan section 20, "Dependency
# hygiene for the Gradle build"), read by the one command in
# apps/human-android/README.md through --config, so this file governs
# every lockfile the scan finds (osv-scanner otherwise reads a config only
# from each lockfile's own directory).
#
# An entry is a reviewed exemption, not a way past the check. The
# acceptance policy is the network lane's (j58, agreed with rust-ui-dev
# in 01a12881 and 01a12883, 2026-10-11).
# tools/checks/check_osv_exemptions.py enforces the shape below in CI's
# tree checks, against the committed lockfiles; its --help is the rule
# text.
#
#   1. A finding on a configuration whose classes reach the APK (any
#      *RuntimeClasspath or *CompileClasspath) is never accepted. It is
#      bumped or removed before the push.
#   2. A finding on a build-only configuration (the buildscript
#      `classpath`, androidLintTool, any other tool configuration) is
#      accepted only as one [[IgnoredVulns]] per OSV id, with an
#      ignoreUntil. The reason carries these labelled lines:
#        artefact:      group:name:version, as the lockfile writes it
#        configuration: every configuration the lockfiles give it
#        severity:      OSV's LOW / MODERATE / HIGH / CRITICAL
#        why:           why no untrusted input reaches it in this build
#        changes:       what would change the answer
#        checked:       the newest stable release of the pinned plugin
#                       line, and the date that was read
#        reviewed:      the review date
#      ignoreUntil is at most 90 days after the review, and 30 for a
#      CRITICAL.
#   3. A bump comes first. Where a stable release of the pinned plugin
#      line removes a finding, the bump is the answer, not an entry. A
#      new stable release ends an entry early, whatever its ignoreUntil
#      says.
#   4. Never [[PackageOverrides]]: it ignores every finding of a
#      package, not one.
#
# What the entries below rest on, as of the review:
#   - Every row sits only on androidLintTool (app/gradle.lockfile) or on
#     AGP's build classpath (buildscript-gradle.lockfile). The tree check
#     rereads this against the lockfiles on every change.
#   - The build reads only this repository's sources and the artifacts
#     of the repositories settings.gradle.kts names: google() and
#     mavenCentral() for dependencies, plus gradlePluginPortal() for
#     plugins. Project-level repositories are refused. There is no
#     Gradle dependency-verification metadata, so those artifacts are
#     trusted by transport, not by checksum.
#   - No Gradle or Kotlin build cache is enabled, locally or in CI, so
#     no cache entry produced elsewhere is read.
#   - AGP is pinned at 9.4.1, and no 9.4.x stable release after it
#     existed when checked (9.5.0 was at alpha09). kotlin-gradle-plugin
#     comes in through AGP and is not declared. rust-ui-dev's j63 bumps
#     on the next stable release and removes what it clears.

