# TEST-ONLY. `publish = false` and the name both say so, but the rule that
# matters is CLAUDE.md §4: no production crate may depend on this package. A
# harness that leaks into a shipped binary carries fake clocks and permissive
# defaults into the one place they must not exist.
[package]
name = "interweave-test-support"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
# `silent-peer` only: a raw libp2p peer holding direct v2 requests
# unanswered, for the shutdown-grace tests. A feature so the suites that
# need only fixtures do not build a swarm.
futures = { workspace = true, optional = true }
libp2p = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# `e2e` only: the desktop harness the end-to-end suites share (`src/e2e`)
# -- a daemon's XDG tree and process, the shipped examples made concrete,
# the schema tree, and the test relay, which is the PRODUCTION relay
# server field (`relay_server_driver`) in a bare Swarm told its external
# address, since a daemon as relay never opens RELAY.md section 8's hop
# gate on one host (`src/e2e/relay.rs`).
interweave-ipc-client = { path = "../../crates/local/ipc-client", optional = true }
interweave-local-client-api = { path = "../../crates/api/local-client-api", optional = true }
interweave-profile-config = { path = "../../crates/config/profile-config", optional = true }
interweave-profile-identity = { path = "../../crates/identity/profile-identity", optional = true }
interweave-transport-api = { path = "../../crates/api/transport-api", optional = true }
interweave-transport-libp2p = { path = "../../crates/transport/libp2p", optional = true }
interweave-transport-runtime = { path = "../../crates/transport/runtime", optional = true }
interweave-trust-api = { path = "../../crates/api/trust-api", optional = true }
tempfile = { workspace = true, optional = true }

[features]
silent-peer = ["dep:futures", "dep:libp2p", "dep:tokio"]
e2e = [
    "dep:futures",
    "dep:interweave-ipc-client",
    "dep:interweave-local-client-api",
    "dep:interweave-profile-config",
    "dep:interweave-profile-identity",
    "dep:interweave-transport-api",
    "dep:interweave-transport-libp2p",
    "dep:interweave-transport-runtime",
    "dep:interweave-trust-api",
    "dep:libp2p",
    "dep:tempfile",
    "dep:tokio",
]
