#
# Real desktop processes (plan §16 Required suites): the transport-daemon
# binary started from a profile file alone, in its own XDG tree, and
# driven over its sockets. TEST-ONLY; nothing depends on this package.
# The binary is the workspace's own build: run the workspace's tests, or
# build `interweave-transport-daemon` first -- a missing binary fails the
# suite by name rather than skipping it.
[package]
name = "interweave-desktop-e2e-tests"
version = "0.0.0"
publish = false
description = "Desktop process tests for the InterWeave transport daemon."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# human_chat.rs: the human client's own facade, store, envelope codec and
# presentation model
# on each side of the two-daemon proof (plan section 17 (7)).
interweave-human-chat-protocol = { path = "../../crates/human/chat-protocol" }
interweave-human-store = { path = "../../crates/human/store" }
interweave-human-transport-client = { path = "../../crates/human/transport-client" }
interweave-human-ui-model = { path = "../../crates/human/ui-model" }
interweave-ipc-client = { path = "../../crates/local/ipc-client" }
interweave-ipc-protocol = { path = "../../crates/api/ipc-protocol" }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-local-client-conformance-tests = { path = "../local-client-conformance" }
interweave-profile-config = { path = "../../crates/config/profile-config" }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
interweave-test-support = { path = "../support", features = ["silent-peer"] }
interweave-transport-api = { path = "../../crates/api/transport-api" }
jsonschema = "0.49"
# human_app/: the shipped client's store file, read-only, while it runs.
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }
