#
# Real desktop processes (plan §16 Required suites): the transport-daemon
# binary started from a profile file alone, in its own XDG tree, and
# driven over its sockets. TEST-ONLY; nothing depends on this package.
# The binaries are the workspace's own build: run the workspace's tests, or
# build `interweave-transport-daemon` (and `interweave-claude-channel`) first -- a missing binary fails the
# suite by name rather than skipping it.
[package]
name = "interweave-desktop-e2e-tests"
version = "0.0.0"
publish = false
description = "Desktop process tests for the InterWeave transport daemon."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# human_chat.rs: the human client's own facade, store, envelope codec and
# presentation model
# on each side of the two-daemon proof (plan section 17 (7)).
interweave-human-chat-protocol = { path = "../../crates/human/chat-protocol" }
interweave-human-store = { path = "../../crates/human/store" }
interweave-human-transport-client = { path = "../../crates/human/transport-client" }
interweave-human-ui-model = { path = "../../crates/human/ui-model" }
interweave-ipc-client = { path = "../../crates/local/ipc-client" }
interweave-ipc-protocol = { path = "../../crates/api/ipc-protocol" }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-local-client-conformance-tests = { path = "../local-client-conformance" }
# The shared desktop harness (`e2e`: `tests/common` re-exports it) and the
# silent peer.
interweave-test-support = { path = "../support", features = ["e2e", "silent-peer"] }
interweave-transport-api = { path = "../../crates/api/transport-api" }
# relayed_path.rs and human_chat.rs: the relay's PeerIds, read back.
libp2p = { workspace = true }
# human_app/a11y.rs: the client's window read and pressed over AT-SPI, the
# way a screen reader reaches it. Both are already compiled for the
# desktop window's platform adapter (accesskit_unix); proxies only, and
# zbus on the executor that adapter runs it on.
atspi = { version = "0.29", default-features = false, features = ["proxies"] }
# human_app/a11y.rs: announcements heard as a stream of AT-SPI signals.
futures-util = { version = "0.3", default-features = false }
jsonschema = "0.49"
# human_app/: the shipped client's store file, read-only, while it runs.
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
# human_app/display.rs: the input focus given to the client's window, as a
# window manager would; the pure-Rust connection, already compiled for
# winit.
x11rb = { version = "0.13", default-features = false }
# claude_channel.rs runs the shipped claude-channel binary as Claude Code
# does: a child process on its stdio.
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt-multi-thread", "time"] }
