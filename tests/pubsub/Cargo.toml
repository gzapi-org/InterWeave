# Copyright 2026 Andrea Benetton
#
# The Stage 7 exit gate: signed GossipSub broadcast between real Rust
# peers. TEST-ONLY; nothing depends on this package.
#
# Activated when Stage 7 opened, carrying only the prerequisite checks —
# that the frozen vectors this stage is built against exist and have the
# shape it will be built to. The behaviour tests the plan requires arrive
# with the behaviour; a package holding assertions for code that does not
# exist would be a stub asserting nothing, which is the opposite of what
# activating a package is for.
[package]
name = "interweave-pubsub-tests"
version = "0.0.0"
publish = false
description = "Stage 7 GossipSub broadcast exit-gate tests for InterWeave."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
interweave-test-support = { path = "../support" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
interweave-transport-runtime = { path = "../../crates/transport/runtime" }
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
libp2p = { workspace = true }
futures = { workspace = true }
interweave-profile-config = { path = "../../crates/config/profile-config" }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
interweave-transport-libp2p = { path = "../../crates/transport/libp2p" }
interweave-trust-api = { path = "../../crates/api/trust-api" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
