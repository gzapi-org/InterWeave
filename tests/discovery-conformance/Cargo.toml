#
# The Stage 9 exit gate: DISCOVERY-CONFORMANCE.md applied to every
# provider, and the composition proof that discovery cannot bypass trust
# or ConnectionManager. TEST-ONLY; nothing depends on this package.
#
# The shared suite is written ONCE over `&mut dyn DiscoveryProvider` and
# run against each provider, because a per-provider copy is a per-provider
# opportunity to weaken an assertion. A deliberately misbehaving provider
# proves the suite catches what it claims to.
[package]
name = "interweave-discovery-conformance-tests"
version = "0.0.0"
publish = false
description = "Stage 9 DiscoveryProvider conformance and composition tests for InterWeave."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
interweave-discovery-api = { path = "../../crates/api/discovery-api" }
interweave-discovery-cache = { path = "../../crates/discovery/cache" }
interweave-discovery-mdns = { path = "../../crates/discovery/mdns" }
interweave-discovery-static = { path = "../../crates/discovery/static" }
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
interweave-transport-libp2p = { path = "../../crates/transport/libp2p" }
interweave-transport-runtime = { path = "../../crates/transport/runtime" }
interweave-trust-api = { path = "../../crates/api/trust-api" }
libp2p = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
