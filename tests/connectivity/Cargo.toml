#
# Root connection and dial admission, over real sockets. TEST-ONLY;
# nothing depends on this package.
#
# Opened for the Stage 5 exit gate and no longer only that: Stage 11
# added the advertised-protocol-set assay, which pins what a default
# profile offers now that the libp2p feature list no longer withholds
# the connectivity behaviours.
#
# The clauses here are about what the SUBSTRATE does with policy, which
# is why they run against a real Swarm over loopback rather than a mock.
# A mocked transport proves that the translation layer compiles, and
# that is precisely how `policy.admit(&request, class, 0)` -- a literal
# zero where the clock belongs -- survived until Stage 5 opened.
[package]
name = "interweave-connectivity-tests"
version = "0.0.0"
publish = false
description = "InterWeave root dial-admission and connection-exposure tests."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
interweave-profile-identity = { path = "../../crates/identity/profile-identity" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
interweave-transport-libp2p = { path = "../../crates/transport/libp2p" }
interweave-transport-runtime = { path = "../../crates/transport/runtime" }
interweave-trust-api = { path = "../../crates/api/trust-api" }
libp2p = { workspace = true }
# `net` beyond the workspace defaults: one test opens a raw TCP
# connection and abandons it, which is the abandoned-handshake case a
# SwarmRuntime cannot produce because it would complete the handshake.
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
# `advertised_protocol_set` drives a bare Identify swarm directly, which
# is a `Stream`; the rest of this package talks to a `SwarmRuntime` and
# never touches one.
futures = { workspace = true }
