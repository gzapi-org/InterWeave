#
# The in-memory binding of plan §17 (2): the four neutral traits over a
# pair of in-memory nodes, so the human client is built against a binding
# that passes the same conformance functions the real ones do. Self-
# contained over the two neutral API crates -- reusing runtime code would
# test shared code against itself. TEST-ONLY; nothing ships it.
[package]
name = "interweave-local-client-fake"
version = "0.0.0"
publish = false
description = "In-memory LocalDataSession binding for InterWeave client tests."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-local-client-api = { path = "../../crates/api/local-client-api" }
interweave-transport-api = { path = "../../crates/api/transport-api" }
