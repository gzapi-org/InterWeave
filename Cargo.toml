# Implementation workspace, populated one canonical stage at a time.
# No production crate is a workspace member until its implementation stage begins.
#
# `members` grows one stage at a time (CLAUDE.md §3): a package is added here in
# the same change that creates its manifest and the tests proving its stage
# gate. `planned_members` below is an inventory, not a queue to drain.
[workspace]
resolver = "3"
members = [
    "crates/api/discovery-api",
    "crates/api/ipc-protocol",
    "crates/api/kademlia-control-api",
    "crates/api/local-client-api",
    "crates/api/transport-api",
    "crates/config/profile-config",
    "crates/discovery/cache",
    # Stage 9: configured bootstrap entries as candidates. Configuration
    # is not trust (ADR-0010).
    "crates/discovery/static",
    # Stage 9: LAN candidate normalization. The multicast mechanism
    # lives in transport/libp2p; this crate owns no socket.
    "crates/discovery/mdns",
    # Stage 10: the Kademlia provider core. Peer routing only (ADR-0009);
    # the Swarm-owned driver lives in transport/libp2p.
    "crates/discovery/kademlia",
    "crates/identity/profile-identity",
    "crates/transport/libp2p",
    "crates/human/chat-protocol",
    "crates/human/core",
    "crates/human/store",
    "crates/transport/runtime",
    "crates/api/trust-api",
    "tests/human-retention",
    "tests/persistence-gate",
    "tests/support",
    "tests/transport-contract",
    # Stage 5: the root dial-admission funnel, proved over real sockets.
    "tests/connectivity",
    "tests/direct-v2",
    "tests/endpoint-routing",
    # Stage 7: signed GossipSub broadcast, which must stay independently
    # functional from direct and must not substitute for it.
    "tests/pubsub",
    # Stage 10: the opt-out exit gate. Only observable end-to-end — a
    # peer that would have routed this one, and a command channel that
    # answers nothing.
    "tests/kademlia",
    # Stage 9: DiscoveryProvider conformance and the composition proof
    # that discovery cannot bypass trust or ConnectionManager.
    "tests/discovery-conformance",
    "xtask",
]

[workspace.package]
license = "Apache-2.0"
edition = "2024"
# Kept in lockstep with rust-toolchain.toml. Stating a minimum the pinned
# compiler does not match is worse than stating none: it reads as a tested
# floor while nothing ever builds against it.
rust-version = "1.97.1"
repository = "https://github.com/gzapi-org/InterWeave"

# Lints are declared once and inherited with `[lints] workspace = true`, so a
# new crate cannot quietly opt out of the policy by omitting a directive.
#
# The clippy selections are not style preferences — each one maps to an
# invariant this architecture states in prose and would otherwise only discover
# at runtime:
#
#   unwrap_used / expect_used / panic — a transport daemon serving untrusted
#     remote input must not have a panic reachable from a parse. Warn rather
#     than deny so tests and xtask stay ergonomic; a production crate that needs
#     it stricter raises its own level.
#   todo / unimplemented / dbg_macro — placeholders that reached a shipped
#     binary once compiled fine.
#
# The bounded-resource invariant (CLAUDE.md §6) is enforced at runtime by
# `overflow-checks` in [profile.release] below rather than by a lint:
# clippy::arithmetic_side_effects fires on every integer `+` in the tree, which
# buys a wall of allow-attributes and no additional guarantee.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Shared dependency versions. A crate writes `serde = { workspace = true }` and
# gets the reviewed version; two crates cannot end up on two versions of the
# same wire-format library, which for a protocol implementation is a
# correctness problem and not merely bloat.
#
# Deliberately short. Stage 0 needs only what Stage 0 builds; libp2p, Slint,
# SQLite and the rest arrive with the stages that activate them.
[workspace.dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lease epochs. Every claim mints a fresh 128-bit generation, and the
# contract wants it unpredictable across restarts, which is a CSPRNG
# and not a counter. The version libp2p-identity already resolves, so
# this adds no crate to the graph.
rand = "0.8"
# SHA-256 for DirectContentFingerprintV1. A pure function with frozen
# vectors, so the implementation is checkable rather than trusted.
sha2 = "0.10"
# base58btc, to decode a PeerId string rather than merely recognising its
# shape. A prefix, an alphabet and a length say a string LOOKS like a
# PeerId; only the decode says it IS one. Already in the graph via
# libp2p-identity, so this adds no crate and no licence term — and no
# `check` feature, because a PeerId carries a multihash rather than a
# base58check payload and enabling it would pull sha2 into a crate that
# does not hash.
bs58 = { version = "0.5", default-features = false, features = ["std"] }
# Brotli for the HumanChatV2 fit-fallback decode path. Used through its
# streaming interface so the decompressed ceiling aborts mid-stream.
brotli = { version = "8", default-features = false, features = ["std"] }
# The libp2p substrate, one behaviour per stage. Stage 4 enabled TCP,
# Noise, Yamux and Identify; Stage 6 added request-response for direct v2;
# Stage 7 added GossipSub; Stage 10 added Kademlia — the first autonomous
# behaviour, and it landed only AFTER the root gate learned to admit
# behaviour-originated dials by policy, the order CLAUDE.md §3 requires.
# Stage 11 adds `autonat`, `relay` and `dcutr`, and it is the same order
# again rather than an exception to it: dial attribution landed first
# (step 1), then SPIKE-004's D1, D2 and D3 were fixed (step 2), and only
# now is the code that can produce those dials compiled at all.
#
# THE ABSENCE OF THESE THREE WAS LOAD-BEARING UNTIL THIS COMMIT, and be
# exact about WHAT it bore. It made these three behaviours
# unconstructible, so none of THEM could originate a dial under a
# reachability origin — which is narrower than "no behaviour-originated
# dial under a reachability origin could exist", because nothing stopped
# another compiled behaviour being wrapped with one.
#
# IT GUARDED ONE OF THE THREE ROUTES TO A RETAINED SUCH CONNECTION, and
# this comment has now said both more and less than that. The routes are
# enumerated in CLAUDE.md §1, and read them there rather than from a
# paraphrase — paraphrasing that list is what went wrong in four
# successive review rounds. In short: a wrapped behaviour whose
# classifier announces a reachability origin, which the feature list
# barred FOR THESE THREE BEHAVIOURS ONLY and not in general, since
# `Attributing<B>` is generic and other dialling behaviours were already
# compiled; an `attempt_dial` call site passing one, never guarded by it
# — `DialOrigin` lives in `interweave-transport-runtime`, which has no
# libp2p dependency; and a relaxation of the inbound arm, never guarded
# by it either.
#
# And it did NOT make a `/p2p-circuit` address dialable. Compiling
# `libp2p-relay` is not installing a relay transport: that needs
# `.with_relay_client(...)` on the builder, which appears nowhere, so
# `runtime/mod.rs` is still `with_tcp` alone and a circuit address is
# exactly as undialable as before. What the absence removed was the
# OPTION of installing one — a property of the builder, which must go on
# being preserved.
#
# Nor was "established" ever impossible: such a connection is established
# and then closed. That is a different state, and NOT yet §14's exposure
# — nothing was advertised in it when measured, though that is an
# observation rather than an invariant and the test does not assert it.
# §14 is about a connection that is KEPT.
# `an_infrastructure_only_peer_gets_a_connection_established_before_it_is_refused`
# demonstrates it, and needs no relay code to do so. From here the guarantee is the gate and its tests, not the
# feature list, and a rule about infrastructure-only peers that has no
# test is now a rule about a reachable state.
#
# The test that replaces THIS clause is
# `tests/connectivity/tests/advertised_protocol_set.rs`: it reads the
# protocol set a default profile advertises, from a third-party Identify
# observer over loopback, and asserts it exactly — so a behaviour
# constructed that nobody configured fails it, PROVIDED that behaviour
# advertises on a direct INBOUND connection — the observer dials, so an
# outbound-only advertisement would be invisible too. Its own doc records what
# that does and does not catch, measured by constructing each behaviour
# in turn: relay server and autonat client are caught, a relay client is
# caught either by panic or by the assertion depending on whether its
# Transport was dropped, and DCUtR is invisible to any observer
# on a direct connection because `libp2p-dcutr` registers its handler
# only on a `/p2p-circuit` one.
#
# `mdns` IS ABSENT, and for a reason unlike any above — not stage order
# but a dependency advisory — worth stating so the
# next reader does not simply switch it on. Stage 9 tried: enabling it
# pulls `libp2p-mdns 0.48`, which pins `hickory-proto 0.25.x`, which
# carries RUSTSEC-2026-0118 (a DNSSEC validation loop that never
# terminates — "No safe upgrade is available!") and RUSTSEC-2026-0119 (a
# name-compression DoS amplification, fixed only in 0.26.1). No upgrade
# resolves them inside the 0.48 line, so `check_dependencies.sh` fails,
# and §8 makes that a real gate rather than a warning.
#
# So the LAN mechanism is deferred and `crates/discovery/mdns` ships
# without it: that crate owns no socket by design, so its normalization,
# bounds and expiry are complete and tested today, and the backend that
# pushes observations into it arrives when libp2p-mdns moves to
# hickory-proto 0.26.
libp2p = { version = "0.56", default-features = false, features = [
    "tcp",
    "noise",
    "yamux",
    "identify",
    "tokio",
    "macros",
    "ed25519",
    # Stage 10. Peer routing only (ADR-0009): the driver in
    # transport/libp2p owns the behaviour, BucketInserts::Manual and
    # StoreInserts::FilterBoth are set at construction, and every dial a
    # query originates passes the root gate that landed first.
    "kad",
    # Stage 6. The direct v2 request-response primitive. Absent until
    # this stage opened, so a behaviour that dials could not exist
    # before the admission funnel it must pass through (CLAUDE.md §3).
    #
    # NOT `cbor`. It was enabled here on the assumption that direct v2
    # responses would ride on it; `DirectCodec` encodes and decodes the
    # frozen binary shapes by hand instead, pinned by
    # `fixtures/direct-v2/`, and nothing in the tree ever referred to
    # cbor. A feature nobody uses is dependency surface bought for
    # nothing.
    "request-response",
    # Stage 7. Signed GossipSub broadcast. It originates no dial of its
    # own — it acts only on connections the gated swarm already admitted,
    # and this crate never calls `add_explicit_peer` — so enabling it does
    # not put an autonomous dialler behind the admission funnel. What it
    # does need is the trust class kept in sync, which is why an
    # infrastructure-only peer is blacklisted from the mesh.
    "gossipsub",
    # Stage 11 (ADR-0035). The CLIENT roles are what this stage builds
    # first, but the features are not role-split — `autonat` and `relay`
    # compile their server halves too, which steps 4 and 6 own. Each
    # originates
    # autonomous dials — an AutoNAT probe, a reservation renewal, a hole
    # punch — so all three arrive only now that the outbound gate
    # attributes a dial to the behaviour that started it rather than
    # assuming Kademlia, and now that the three ADR-0036 violations
    # SPIKE-004 found in the admission path are fixed.
    #
    # COMPILED IS NOT CONSTRUCTED. None of the three has a field in
    # `SubstrateBehaviour`, a constructor, or a configuration path — the
    # code to build them is not written, so no profile advertises their
    # protocols and none of their dials can exist. That is what lets the
    # features land before the configuration that will drive them, and it
    # is a stronger position than the `Toggle`-and-`None` shape `kad`
    # has: a disabled behaviour is still a behaviour.
    "autonat",
    "relay",
    "dcutr",
] }
# The async runtime the Swarm is driven on. Bounded channels only (§6).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
futures = "0.3"
# THE `request_response::Codec` TRAIT IS `#[async_trait]`, so an impl of
# it must be too. Already in this graph as libp2p-request-response's own
# dependency, at this exact version and under MIT OR Apache-2.0 — both
# already on the allow-list — so declaring it here adds no licence or
# advisory surface, only a name.
async-trait = "0.1.92"
# Two-variant sum type, for `ClassGated`'s connection handler: a gated
# connection installs a denying upgrade where the inner behaviour's would
# go, and `ConnectionHandler` demands ONE protocol type for both. Already
# in this graph as `libp2p-swarm`'s own dependency — its `Either`
# handler impl is built on this exact version — so declaring it adds no
# crate and no licence term, only a name. `libp2p` does not re-export it.
either = "1.17.0"

# The libp2p identity boundary. Pinned to 0.2 because that is what
# `libp2p` 0.56 depends on, and two versions in one graph would mean two
# incompatible `Keypair` types — the identity crate could not hand its key
# to the Swarm at all.
#
# SPIKE-006 was first run against 0.3.0 and re-run against this version
# when the substrate landed; the three findings are identical, and the
# spike records both. The point of pinning is that the findings are about
# a specific API surface, so the version the spike measured has to be the
# version that ships.
libp2p-identity = { version = "0.2.14", default-features = false, features = ["ed25519", "peerid", "rand"] }
# BIP-39 entropy <-> words. Used for the mapping only; the PBKDF2 seed
# derivation it also offers is the wallet convention and is never called
# (ADR-0033, fixtures/identity/ed25519-bip39-entropy-v1.json).
bip39 = { version = "2", default-features = false, features = ["std"] }
# SQLite for the human store (STATE.md). `bundled` compiles the amalgamation
# rather than linking whatever the host provides: desktop and Android must
# agree on the storage engine, and a retention invariant that depends on the
# distribution's SQLite version is not an invariant. `default-features =
# false` drops the WASM shim that 0.40 enables by default.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# Temporary directories for storage tests. A retention test that never
# touches a real file cannot prove anything survives a restart.
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables only: enough for a symbolicated backtrace out of a deployed
# daemon, without the size of full debug info.
debug = 1
# ON IN RELEASE, on purpose. The default is off, which makes every bound in
# section 6 of CLAUDE.md hold in debug and wrap in production — the one build
# where a wrapped length or counter is unobservable.
overflow-checks = true

[workspace.metadata.interweave]
# The open stage of the canonical plan, and the ONE machine-readable place
# it is recorded. Every human-facing status sentence — README.md,
# IMPLEMENTATION.md, CLAUDE.md §1 — is checked against this value by
# tools/checks/check_stage_status.sh, because three prose copies of one
# fact drifted apart twice before the check existed.
#
# Do not restate the member list here. `[workspace].members` above is the
# only roster, and a comment describing it goes stale the moment a stage
# opens.
# STAGE 11'S PREREQUISITE IS HALF MET. SPIKE-004's phase A closed
# 2026-09-01 (PASS for implementation, loopback only), so the
# AutoNAT/Relay/DCUtR work this value authorizes may proceed. Its phase
# B — the real-NAT matrix — has not run, so the stage cannot CLOSE, and
# no production code may assume server-mode reachability evidence
# exists. The verdict's findings bind rather than inform. Three of them
# were live violations in already-shipped code — D1, D2 and D3 — and all
# three were fixed in step 2 (2026-09-04 and -09-05), before the paths
# they govern were built rather than after: read
# architecture/roadmap/SPIKES.md before extending the stage.
status = "stage-11-connectivity"
architecture_root = "architecture"

planned_members = [
  "apps/transport-daemon",
  "apps/transportctl",
  "apps/claude-channel",
  "apps/human-desktop",
  "apps/human-android",
  "crates/api/transport-api",
  "crates/api/discovery-api",
  "crates/api/trust-api",
  "crates/api/local-client-api",
  "crates/api/ipc-protocol",
  "crates/api/kademlia-control-api",
  "crates/config/profile-config",
  "crates/transport/runtime",
  "crates/transport/libp2p",
  "crates/discovery/cache",
  "crates/discovery/static",
  "crates/discovery/mdns",
  "crates/discovery/kademlia",
  "crates/local/ipc-client",
  "crates/local/ipc-server",
  "crates/claude/channel-core",
  "crates/human/core",
  "crates/human/chat-protocol",
  "crates/human/store",
  "crates/human/ui-model",
  "crates/human/ui-slint",
  "crates/human/android-platform",
  "xtask",
]

planned_test_packages = [
  "tests/support",
  "tests/transport-contract",
  "tests/discovery-conformance",
  "tests/local-client-conformance",
  "tests/ipc-v2",
  "tests/direct-v2",
  "tests/pubsub",
  "tests/endpoint-routing",
  "tests/human-chat",
  "tests/human-retention",
  "tests/security",
  "tests/desktop-e2e",
  "tests/android-e2e",
  "tests/interoperability",
]

# ADR-0051. `libp2p-autonat` 0.15.0's v2 client tests a candidate address
# once and never again: a result leaves it `Received` or `Failed`, the tick
# sweeps only `Untested`, and no public path resets one. ADR-0035's two
# distinct observers and AUTONAT.md §5's refresh therefore have no
# mechanism in the crate as shipped, and upstream `master` is the same.
# The vendored copy is the crates.io tarball MINUS its packaging files
# (`.cargo_vcs_info.json`, `Cargo.toml.orig`, `Cargo.lock`), PLUS the
# upstream `LICENSE` and `INTERWEAVE.patch`: one method,
# `Behaviour::retest`, and the guard that stops an abandoned probe
# reporting an outcome. ADR-0051 Decision 2 is the authority on that
# list; this comment said "the tarball plus `INTERWEAVE.patch`" and was
# the last place still saying it. Drop this patch when a release carries an
# equivalent; `tools/checks/license_exempt.txt` names the provenance.
[patch.crates-io]
libp2p-autonat = { path = "third_party/libp2p-autonat" }
