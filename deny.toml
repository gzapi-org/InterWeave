# Copyright 2026 Andrea Benetton
#
# Dependency policy: what this project is willing to depend on, and on
# what terms. Enforced by `tools/checks/check_dependencies.sh`.
#
# The policy is an ALLOW-LIST in every dimension that has one. A deny-list
# only stops what someone thought to name, and the interesting supply-chain
# failure is always the thing nobody thought of.
#
# Written before libp2p arrives on purpose. The graph is 240 packages
# today and libp2p roughly doubles it; a policy adopted after that has to
# be written around whatever is already there, which is how an allow-list
# turns into a description of the status quo.

[graph]
# Every feature, so a dependency that only appears under a non-default
# feature is still governed. Checking the default feature set would leave
# `rusqlite/bundled` — a C library compiled into the binary — outside the
# policy.
all-features = true

# Dev-dependencies ARE included. They are not distributed, so their
# licences carry no obligation on a release, but they execute on developer
# machines and in CI with full access to the checkout and the token. The
# advisory check is the reason: a compromised test-only crate is a
# compromised build.
exclude-dev = false

# The targets this repository builds, and only those (plan section 18
# (14), the owner's decision of 2026-10-04): what ships on another
# platform is judged when that platform is built. Without it the graph is
# every target's, and a Windows-only or iOS-only dependency of the
# windowing backend would be judged as if it shipped here.
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
# A yanked version is one its own author withdrew. Continuing to build on
# it needs a reason written down, not silence.
yanked = "deny"
# Short on purpose. Each entry is a decision to ship with a KNOWN
# advisory, so it carries the ID, the reason it is tolerable, and what
# would change the answer.
ignore = [
    # `paste` 1.0.15 — unmaintained, not vulnerable. A proc-macro that
    # concatenates identifiers, reached transitively through the libp2p
    # substrate.
    #
    # Tolerated because of WHERE it runs: a proc-macro executes at compile
    # time and contributes no code to the binary, so an unmaintained one
    # is a build-reproducibility concern rather than a runtime attack
    # surface. Its input is this workspace's own source.
    #
    # Revisit if it ever gains a vulnerability advisory rather than an
    # unmaintained one, or if libp2p drops it — at which point this entry
    # should be deleted rather than left to accumulate.
    { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time-only proc-macro reached through libp2p; unmaintained, not vulnerable" },
    # `ttf-parser` 0.25.1 -- unmaintained, not vulnerable. Reached only
    # through winit's Wayland client-side decorations (winit ->
    # sctk-adwaita -> ab_glyph -> owned_ttf_parser), which Slint's
    # `backend-winit` turns on with its Wayland support; Slint's own font
    # stack does not name it (`cargo tree -i ttf-parser`). Dropping it
    # means dropping Wayland (`backend-winit-x11`), which is not on offer
    # (plan section 18 (14), the owner's decision of 2026-10-04). Revisit
    # at the next Slint or winit bump, and delete this entry the moment
    # the graph no longer names the crate.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is reached only through winit's Wayland decorations (sctk-adwaita), enabled by Slint's backend-winit; unmaintained, not vulnerable; revisit at the next Slint or winit bump" },
]

[licenses]
version = 2
# Everything not listed is DENIED. These are the terms compatible with
# shipping an Apache-2.0 project, and each was observed in the current
# graph rather than added speculatively.
# Exactly the terms the current graph resolves to, and no more. An
# aspirational entry is worse than a missing one: it makes the next
# dependency slip in without anyone deciding, which is the whole failure an
# allow-list exists to prevent. Adding one should cost a commit and a
# sentence about why those terms are acceptable.
#
# AND THAT IS MECHANICALLY HELD in one direction, which is better than any
# number written here: `tools/checks/test_check_dependencies.sh` fails the
# suite if `cargo deny check licenses` emits `license-not-encountered`, so
# an entry the graph stopped using turns the self-test red. The other
# direction is the `allow`-list itself -- an unlisted licence is denied.
#
# NO COUNT HERE, and no claim about which entries carry a note. Two earlier
# versions of this paragraph got both wrong: it said "the six" and "a
# seventh" while the list held nine, and the correction then asserted that
# each entry has its own note -- five of them have none, and one note
# covers three. A sentence beside the list it describes goes stale exactly
# as silently as a count does, which was the lesson the correction itself
# was citing. Review findings on PR #85.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    # CC0-1.0 — added 2026-08-19 for `bip39` and the two crates it pulls,
    # `bitcoin_hashes` and `hex-conservative`.
    #
    # A public-domain dedication: the most permissive terms available, with
    # no attribution or notice obligation, so nothing about it constrains
    # shipping an Apache-2.0 project.
    #
    # The alternatives were worse rather than better. Vendoring the 2048-word
    # list would make the wallet PBKDF2 path literally nonexistent, which is
    # attractive — but BIP-0039 is BSD-2-Clause, so it would mean a copied
    # asset, a provenance record and an exemption entry -- and BSD-2-Clause
    # was not yet on this list when that trade was weighed on 2026-08-19, so
    # it would have meant adding one licence to avoid another. It is on the
    # list now, added with the libp2p substrate the same day, so the trade
    # today is the copied asset and its provenance against nothing. The
    # decision stands on the first three costs either way. Swapping to
    # `tiny-bip39` would avoid the copied asset as well, but choosing a
    # less-maintained fork of a crypto-adjacent crate to keep a list short is
    # optimising the wrong thing.
    #
    # An earlier wording said "a SIXTH licence to avoid a fifth" -- stale but
    # anchored to that date. Replacing it with an unqualified "ANOTHER
    # licence on this list" turned a stale count into a false present-tense
    # claim, which is worse. The `tiny-bip39` sentence was then left stranded
    # at the end of this history note, where "the edit" had no antecedent left
    # -- the licence edit it meant is the cost the paragraph above had just
    # stopped claiming. Review findings on PR #85.
    #
    # Recorded cost, since it is real: `bip39` brings `bitcoin_hashes` for a
    # SHA-256 this workspace already has in `sha2`. Worth revisiting if the
    # Bitcoin dependency chain grows, not worth a worse crate today.
    "CC0-1.0",
    # BSD-2-Clause, ISC and Zlib — added 2026-08-19 with the libp2p
    # substrate (Stage 4). All three are permissive notice-only licences
    # of the same family as the ones already here.
    #
    # These are the three I REMOVED on 2026-08-19 as unmatched, when the
    # graph did not yet contain them. That was the right call and this is
    # the proof: the next real dependency had to re-admit them
    # deliberately rather than sliding in under an aspirational entry.
    #
    # `ring` is `Apache-2.0 AND ISC` — a conjunction, so both halves must
    # be allowed for it to resolve. Apache-2.0 already was; ISC is what
    # completes it.
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    # MIT-0 -- added 2026-10-10 for `borrow-or-share` 0.2.4, which entered
    # through `fluent-uri` and `referencing` under `jsonschema` 0.49 once
    # that became `interweave-test-support`'s optional dependency (its `e2e`
    # feature, the shared end-to-end harness's schema validator, #252).
    #
    # MIT No Attribution: OSI-approved, MIT with the notice duty removed,
    # so strictly more permissive than MIT, which this list admits; nothing
    # about it constrains shipping an Apache-2.0 project. Decided by
    # architect-cto with the network lane (01a12514), on the rule for this
    # list: observed in the graph, a sentence, a commit. A term that is not
    # plainly a subset of one already admitted goes to the owner first.
    "MIT-0",
]
# A dual-licensed crate is resolved by taking the allowed side. `r-efi` is
# `Apache-2.0 OR LGPL-2.1-or-later` and resolves to Apache-2.0; this
# threshold makes that automatic while still refusing a crate whose ONLY
# terms are copyleft.
confidence-threshold = 0.93

# The Slint toolkit -- added with crates/human/ui-slint (plan §17 (8)).
#
# Each crate offers "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0". The owner decided on 2026-10-01 to
# admit Slint under the Royalty-free licence (plan §17, the decision
# block; ADR-0039 names licensing as a revisit trigger, and that is the
# revisit's answer). So the Royalty-free term is allowed for exactly these
# crates and no other: an exception rather than an `allow` entry, so the
# next dependency offering the same LicenseRef is refused until someone
# decides it. The GPL side is never taken.
#
# `i-slint-backend-testing` carries the same terms and has NO exception:
# it is a dev-dependency, and cargo-deny's licence check skips
# dev-dependencies unless `licenses.include-dev` is set, which it is not
# -- measured on 2026-10-03 (a dev-only Slint crate passes; the same crate
# as a normal dependency, or with include-dev, is rejected). Advisories
# DO cover it (`exclude-dev = false`, in `[graph]` above). It is not distributed: the
# views test against it, nothing ships it.
#
# THE WINDOWING BACKEND (plan section 18 (14), the owner's decision of
# 2026-10-04): winit with the software renderer and the accessibility
# adapter, behind ui-slint's `desktop` feature. Its two Slint crates join
# the exceptions below on the same terms. The skia renderer, which
# backend-winit names only for Apple's mobile targets, and BSL-1.0
# (clipboard-win and error-code, Windows-only through arboard) fall
# outside the graph `[graph] targets` judges: BSL-1.0 is NOT admitted, and
# is decided on its own when the Windows binding comes.
#
# What this does NOT settle: the Royalty-free licence's attribution duty,
# which the shipped app carries (Stage 15, with its window).
[[licenses.exceptions]]
crate = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]
[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[bans]
# WARN, not deny. Duplicate versions are real bloat and a real hazard when
# the duplicate is a crypto or parsing crate, but they arrive through
# transitive graphs nobody here controls, and denying them would make the
# check fail for reasons no commit in this repository caused. Reviewed at
# the point a duplicate appears in a diff.
multiple-versions = "warn"
# A `*` version requirement means "whatever resolves today", which is the
# opposite of the reproducibility the rest of this repository is built on.
wildcards = "deny"
# Except between packages in this workspace. `{ path = "../foo" }` with no
# version is how every intra-workspace dependency here is written, and it
# is not a wildcard in the sense that matters: the resolved code is in this
# repository, at this commit, and moves only when someone edits it.
allow-wildcard-paths = true

[bans.build]
# Native EXECUTABLES shipped inside a crate, detected by content rather
# than by extension. A build script is at least source someone can read;
# a precompiled binary in a crates.io package is code nobody in the
# dependency chain has seen, running with the developer's environment at
# compile time. There is no legitimate reason for one here.
executables = "deny"

# ALLOWED, after measuring it. Turned on, this reports 83 shell scripts
# in the current graph — every one a legitimate `ci/` or `tests/` file
# that got swept into a published tarball by aws-lc-sys, zerocopy,
# aws-lc-rs and libc. None is executed by a build script here.
#
# Left as a warning it would print 83 multi-line blocks on every local
# `cargo xtask checks` run, burying the output of every other check. A
# warning nobody reads is worse than no warning, because it teaches
# people to scroll past this tool's output entirely.
#
# `executables = "deny"` above is the part of this that carries signal:
# it fires on zero crates today, so any future hit is genuinely anomalous
# rather than one of eighty-four.
interpreted = "allow"

# NOT SET: a build-script allow-list.
#
# It is the strongest supply-chain control cargo-deny offers — a build
# script is arbitrary code executed at compile time, before any test runs
# and with the developer's full environment. Thirty-one crates in the
# current graph have one, including libc, ring, aws-lc-sys and
# libsqlite3-sys, and libp2p will add more.
#
# It is deliberately left off rather than set to a list, because a list
# that has to be edited on every transitive bump is a list that gets
# widened under time pressure until it means nothing. Turning it on is a
# decision to accept that maintenance; recording the absence here is
# better than a `allow-build-scripts` entry that silently grows.

[sources]
# The supply-chain control that matters most and costs least: code may
# come from crates.io and nowhere else. A git dependency is a moving
# target with no version, no yank mechanism, and no advisory database.
#
# ONE EXCEPTION, and it is a path rather than a registry: ADR-0051
# vendors `libp2p-autonat` into `third_party/` and selects it with
# `[patch.crates-io]`. A path patch carries no `source`, so this check
# has nothing to evaluate and passes truthfully -- which is also why it
# cannot see such a crate's ADVISORIES, and why
# `tools/checks/check_vendored_advisories.sh` exists. Vendoring is
# deliberately not barred here, because barring it would leave a git
# dependency as the only route to a crate that needs a local change, and
# that is the worse of the two.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
