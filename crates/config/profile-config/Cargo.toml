#
# Configuration-v2 structures, cross-field validation, and — since Stage 3
# — the profile path layout and the atomic owner-only writes beneath it.
#
# The Stage 1 comment here argued that a crate knowing about paths would
# tie the validation rules to one deployment's layout. That argument was
# about a DEPENDENCY, and it still holds: `paths` and `persist` are leaf
# modules, and the validation in `lib.rs` references neither. Nothing that
# decides whether a config is legal can see where it came from. What
# changed is only that the layout now lives beside the format instead of
# in a crate of its own with two modules in it.
[package]
name = "interweave-profile-config"
version = "0.0.0"
publish = false
description = "InterWeave profile configuration v2 structures and cross-field validation."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-transport-api = { path = "../../api/transport-api" }
interweave-trust-api = { path = "../../api/trust-api" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
