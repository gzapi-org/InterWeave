# Copyright 2026 Andrea Benetton
#
# Configuration-v2 structures, cross-field validation, and — since Stage 3
# — the profile path layout and the atomic owner-only writes beneath it.
#
# The Stage 1 comment here argued that a crate knowing about paths would
# tie the validation rules to one deployment's layout. That argument was
# about a DEPENDENCY, and it still holds: `paths` and `persist` are leaf
# modules, and the validation in `lib.rs` references neither. Nothing that
# decides whether a config is legal can see where it came from. What
# changed is only that the layout now lives beside the format instead of
# in a crate of its own with two modules in it.
[package]
name = "interweave-profile-config"
version = "0.0.0"
publish = false
description = "InterWeave profile configuration v2 structures and cross-field validation."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The discovery contract owns the address ceiling this crate's static
# bootstrap entries are built from; parsing that block without it means
# duplicating a normative constant.
interweave-discovery-api = { path = "../../api/discovery-api" }
interweave-transport-api = { path = "../../api/transport-api" }
# §13's cross-field limits have one statement, `validate_limits`, which
# the provider and the driver each apply as well; the profile applies the
# same one rather than restating it. A neutral contract crate: types and
# validation, no backend.
interweave-kademlia-control-api = { path = "../../api/kademlia-control-api" }
interweave-trust-api = { path = "../../api/trust-api" }
serde = { workspace = true, features = ["derive"] }
# The trust overlay's file (`trust_overlay.rs`, ADR-0028 A 2026-10-07):
# two lists of peer ids in the state directory. Already in the graph
# through the IPC crates.
serde_json = { workspace = true }
# The one production YAML loader (`ProfileConfig::load`), admitted by the
# owner on 2026-09-28 (plan §16). Its parser is a C translation
# (unsafe-libyaml-norway); what it reads is the operator's own
# owner-local profile document, capped at MAX_PROFILE_BYTES before
# parsing.
serde_norway = "0.9.42"

# `O_NOFOLLOW` for the profile lock (`lock.rs`): its value differs by
# ABI, and a hand-typed table got aarch64 wrong. Already in the graph
# through tokio; this adds no code to what is compiled.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.189"

# The name service the private-group rule reads (ADR-0028 A 2026-10-08,
# "a group of one is the owner's own"): `getpwuid_r` and `getgrgid_r`,
# NSS-backed, as safe calls -- the crate forbids unsafe code. Already in
# the graph through rtnetlink at this version; `user` adds no crate.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["user"] }
# Whether a group-writable directory or file carries a POSIX access ACL,
# which makes its group bits the ACL's mask (the same amendment, #231):
# `lgetxattr`/`fgetxattr` as safe calls. Already in the lockfile at this
# version with `fs` on, so no package is added there -- but until now only
# the desktop graph compiled it: the daemon and transportctl gain rustix
# and linux-raw-sys through this line.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
# Synthetic test identities are built from BYTES, since `parse` decodes
# the base58btc and checks the multihash. Test-only.
bs58 = { workspace = true }
# For one assertion only: that `CACHE_MAX_PEERS` still equals the cache's
# own frozen limit. A dev-dependency keeps the mirror honest without
# making a configuration crate depend on a provider implementation.
interweave-discovery-cache = { path = "../../discovery/cache" }
# Likewise, for the two AutoNAT client defaults this crate and the
# reachability manager both declare. Same reasoning: the state machine is
# a runtime implementation and a configuration crate must not depend on
# it to learn a number, but the two copies must not drift.
interweave-transport-runtime = { path = "../../transport/runtime" }
# And for the client's silence bound: the profile states it from the
# contract (`ipc::CLIENT_SILENCE_TIMEOUT_MS`) and the IPC protocol names
# it for the client's timer; a configuration crate must not depend on
# the protocol to learn a number, but the two copies must not drift.
interweave-ipc-protocol = { path = "../../api/ipc-protocol" }
tempfile = { workspace = true }
