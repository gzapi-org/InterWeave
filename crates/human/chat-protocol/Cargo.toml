# Copyright 2026 Andrea Benetton
#
# HumanChatV2 envelope, media type, and the bounded decode path (ADR-0050).
# Above transport and independent of it: no libp2p, no IPC, no UI. The
# same library serves the desktop client, the Android client, and the
# Claude bridge, which is what makes "decompression happens once" true
# rather than aspirational.
[package]
name = "interweave-human-chat-protocol"
version = "0.0.0"
publish = false
description = "HumanChatV2 envelope parsing, validation, and bounded decompression."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
brotli = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
interweave-transport-api = { path = "../../api/transport-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
# The render model (plan §17 (3)): a client renders, the bridge decodes
# and never parses, so the parser is OFF by default and only a client
# turns it on (`check_bridge_default_features.sh`).
markdown = ["dep:pulldown-cmark"]

[dev-dependencies]
serde_json = { workspace = true }
