#
# The human client's transport facade (plan §17 (1)): the client's half
# of retention over the neutral LocalDataSession traits. It names nothing
# under crates/transport/*, no libp2p and no slint -- the human-layering
# check holds it to that.
[package]
name = "interweave-human-transport-client"
version = "0.0.0"
publish = false
description = "The InterWeave human client's transport facade over LocalDataSession."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-chat-protocol = { path = "../chat-protocol" }
interweave-human-store = { path = "../store" }
interweave-local-client-api = { path = "../../api/local-client-api" }
interweave-transport-api = { path = "../../api/transport-api" }
# The transport id each pending row is minted with (schema v6).
rand = { workspace = true }
# An outbound envelope is round-tripped through HumanChatV2::parse.
serde_json = { workspace = true }

[dev-dependencies]
interweave-local-client-fake = { path = "../../../tests/local-client-fake" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
# Reads a store's page count to size a quota, in one test.
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
