#
# The reference views (plan §17 (8)): Slint components bound to ui-model.
# The only crate under crates/human whose graph names slint (P2).
[package]
name = "interweave-human-ui-slint"
version = "0.0.0"
publish = false
description = "The InterWeave human client's reference Slint views."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-human-client-api = { path = "../client-api" }
# The body's block tree, drawn as plain text (`body.rs`); the parser
# is ui-model's already, the feature is the same.
interweave-human-chat-protocol = { path = "../chat-protocol", features = ["markdown"] }
interweave-human-ui-model = { path = "../ui-model" }
# The `PeerId` a trust list's press names, held by identity as an item's
# press is: a neutral type, no transport behind it.
interweave-transport-api = { path = "../../api/transport-api" }
slint = { workspace = true }
# fontconfig opened at run time, not linked at build time (the workspace
# manifest says why); and, under `desktop`, the font stack `code_font`
# asks for the platform's monospaced family.
i-slint-common = { workspace = true }
# The font stack's own loader, asked by `platform_check`.
yeslogic-fontconfig-sys = { workspace = true }

[features]
# The desktop window (plan section 18 (14), the owner's decision of
# 2026-10-04): winit with the software renderer and the platform
# accessibility adapter. Off by default, so the views' own tests and any
# crate that needs only the model build no windowing system; the desktop
# app turns it on. `unstable-winit-030` is the only public way to observe
# the window's focus (WinitWindowAccessor), which a read is gated on.
desktop = [
    "slint/backend-winit",
    "slint/renderer-software",
    "slint/accessibility",
    "slint/unstable-winit-030",
    # The font stack the renderer uses, asked for the platform's
    # monospaced family (`code_font`); already compiled by the software
    # renderer, so this names it rather than adding it.
    "i-slint-common/shared-fontique",
]

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
interweave-human-chat-protocol = { path = "../chat-protocol" }
interweave-human-core = { path = "../core" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
interweave-transport-api = { path = "../../api/transport-api" }

[package.metadata.cargo-machete]
# slint-build is a BUILD dependency, called from build.rs to compile
# ui/app.slint; `cargo-machete --with-metadata` reports it unused.
ignored = ["slint-build"]
