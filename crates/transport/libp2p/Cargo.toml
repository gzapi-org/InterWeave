#
# The authenticated transport substrate, and the behaviours the open
# stages have earned.
#
# TCP, Noise, Yamux and Identify from Stage 4; direct v2 over
# request-response from Stage 6; signed GossipSub from Stage 7; Kademlia
# from Stage 10, peer routing only; AutoNAT v2, Circuit Relay v2 and
# DCUtR from Stage 11. Client roles are what this stage builds first;
# the features are not role-split, so the AutoNAT and Relay server
# halves are compiled too and later steps own them.
#
# THE FEATURE LIST WITHHOLDS NO BEHAVIOUR THIS STAGE BUILDS, and since
# 2026-09-20 it withholds nothing at all: `mdns` and `dns` joined it,
# and neither dials on its own.
#
# `mdns` was STAGE 11'S OWN OBLIGATION, not an unowned gap:
# `contracts/DISCOVERY-CONFORMANCE.md`'s 2026-08-30 amendment deferred the
# mDNS multicast tests to this stage and called that a deadline. It was
# held off first by RUSTSEC-2026-0118 and -0119 inside the
# `libp2p-mdns 0.48` line `libp2p 0.56` selected, then -- once PR #109's
# bump to `libp2p 0.57` cleared them -- only by a stage decision nobody
# had taken. The mechanism is now built (`mdns_scope`,
# `runtime::mdns_driver`), constructed only when a profile asks for it,
# and the deadline reads TAKEN-NOT-MET until SPIKE-010's multicast run.
# Real multicast packets cross the crate in tests/mdns_bounds.rs, inside
# a network namespace (ADR-0053's bounds); the LAN rows have not run.
#
# `dns` had no stage owning it until architect-cto ruled it into this
# one. The Swarm builder now wraps the base transport in it, so a name
# the OPERATOR supplies -- profile configuration, or the operator's
# `AddAddress` command -- resolves at dial, and `profile-config` accepts
# a `/dns4` or `/dns6` host. A name a PEER supplies is refused wherever
# it would enter a store or a dial (ADR-0052, A 2026-09-20 and
# A 2026-09-25). Before the transport was built such a name was
# undialable only by accident: the dial failed `MultiaddrNotSupported`,
# was classified structural, and the address was forgotten -- which is
# why `profile-config` refused one at validation until the transport
# existed.
#
# Every stage before this
# one could say a behaviour was absent from the workspace features rather
# than merely unused, so a stray `use` could not switch it on and
# CLAUDE.md §3's promise was kept by the compiler. From Stage 11 it is
# kept by the outbound gate, the trust classification and their tests —
# which is why attribution (step 1) and SPIKE-004's D1/D2/D3 (step 2) both
# landed before the manifest changed.
#
# This paragraph said "No Kademlia" for a stage and a half after Stage 10
# added `kad` to the workspace features and built a driver on it. It is
# the file a reader consults to check exactly the claim it was getting
# wrong.
#
# This header claimed "no direct v2" for a full stage after direct v2
# shipped, which is why the rule about prose describing changed behaviour
# names a manifest comment as prose that ships.
#
# This crate owns the Swarm. Nothing above it sees a `libp2p::` type:
# the boundary speaks `TransportIdentity` and this crate's own command
# and event enums, so the backend stays replaceable and the neutral
# contracts stay free of libp2p (CLAUDE.md §4).
[package]
name = "interweave-transport-libp2p"
version = "0.0.0"
publish = false
description = "InterWeave libp2p transport substrate: TCP, Noise, Yamux, Identify, direct v2, GossipSub, Kademlia."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-profile-identity = { path = "../../identity/profile-identity" }
interweave-transport-api = { path = "../../api/transport-api" }
interweave-transport-runtime = { path = "../runtime" }
interweave-profile-config = { path = "../../config/profile-config" }
interweave-local-client-api = { path = "../../api/local-client-api" }
interweave-trust-api = { path = "../../api/trust-api" }
# The neutral command/event port between the Kademlia provider and this
# crate's driver. Both concrete sides depend on it; neither depends on
# the other (kademlia-integration.md §20).
interweave-kademlia-control-api = { path = "../../api/kademlia-control-api" }
# The candidate shape the port's query results carry.
interweave-discovery-api = { path = "../../api/discovery-api" }
# `ClassGated`'s handler needs one protocol type covering both the inner
# behaviour's upgrade and the denying one; see `class_gate.rs`.
either = { workspace = true }
# SHA-256 for the network-namespace derivation (§4), checked against the
# frozen vectors in fixtures/kademlia/.
sha2 = { workspace = true }
futures = { workspace = true }
# The host resolver configuration, read here so its absence degrades
# name resolution rather than the whole node; see the root manifest.
hickory-resolver = { workspace = true }
libp2p = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The mDNS bounds test's observer on the multicast group needs address
# and port reuse to share 5353 with the crate. Already in the graph as
# the vendored mDNS crate's own dependency, with the same features, so
# it adds no crate and no licence term. Test-only.
socket2 = { version = "0.6.5", features = ["all"] }
# The dead-watcher test supplies its own interface watcher, whose item
# type is if-watch's `IfEvent`. Already in the graph as the vendored mDNS
# crate's own dependency, so it adds no crate and no licence term.
# Test-only.
if-watch = { version = "3.2.2", default-features = false }
# TEST-ONLY, and a DEV-dependency only: CLAUDE.md §4 bars it from ever
# being a production dependency. The wire tests take the host's private
# address from it, because ADR-0052 refuses loopback from a peer and a
# test that cannot run must fail rather than pass.
interweave-test-support = { path = "../../../tests/support" }
# Synthetic identities are built from BYTES: the neutral grammar decodes
# the base58btc, so a spelled tail is not a peer id. Test-only.
bs58 = { workspace = true }
# The codec's frozen-frame test reads the fixture file rather than
# quoting bytes it could have copied from the encoder.
serde_json = { workspace = true }
# Trust sources are constructed by tests, not by this crate: the
# substrate passes a `TrustSources` through to the manager and never
# names the two authorities inside it.
tempfile = { workspace = true }
# `test-util` for the paused clock: the outbound gate's backoff-lapse
# test advances time rather than sleeping through a real backoff.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
