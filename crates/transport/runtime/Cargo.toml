#
# Stage 2 activates the PURE modules of the runtime only: state machines
# and decisions, exhaustively testable without a socket or a Swarm. No
# libp2p, no async runtime, no I/O — those arrive with the stages that
# open them, and keeping them out now is what makes this logic testable
# by enumeration rather than by orchestration.
[package]
name = "interweave-transport-runtime"
version = "0.0.0"
publish = false
description = "Backend-neutral transport runtime state machines for InterWeave."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-local-client-api = { path = "../../api/local-client-api" }
interweave-transport-api = { path = "../../api/transport-api" }
interweave-trust-api = { path = "../../api/trust-api" }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
