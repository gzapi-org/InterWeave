#
# Stage 17 (plan §20 step 1): the transport runtime composed for an
# in-process host -- the Android app's foreground service -- with the
# trust boundary its platform supplies. The Stage 12 composition and its
# in-process LocalDataSession/LocalAdminPort binding, not a second
# adapter (§15 (3)); no Android, JNI or UI type, so it builds for the
# host and the device alike and its tests run on the host. The Service,
# its lifecycle and the JNI side are rust-ui-dev's (architect-cto seq
# 32946; the seams agreed in rust-ui-dev's seq 33010).
[package]
name = "interweave-transport-embedded"
version = "0.0.0"
publish = false
description = "The InterWeave transport runtime hosted in-process under a platform-supplied trust boundary."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The admin port the host opens for its owner's own shutdown request
# (`EmbeddedHost::request_shutdown`): the neutral traits the binding
# implements.
interweave-local-client-api = { path = "../../api/local-client-api" }
interweave-profile-config = { path = "../../config/profile-config" }
interweave-profile-identity = { path = "../../identity/profile-identity" }
# The PeerId a custody record names (`custody`), as the neutral type the
# identity's own checks take.
interweave-transport-api = { path = "../../api/transport-api" }
interweave-transport-composition = { path = "../composition" }
# The host's own runtime: the Service thread is not async, and the
# binding's futures need an executor the Service can drive them on.
tokio = { workspace = true }
# The log filter the host's sink applies (`log_admits`), in `tracing`'s
# levels. Already in the graph through the composition.
tracing = { workspace = true }

[features]
# TEST-ONLY: end the runtime's driver from a test, through the
# composition's own hook (`EmbeddedHost::end_runtime_for_test`). Enabled
# by this crate's tests as a dev-dependency feature, which builds that
# compile dev targets unify in; no normal dependency names it, as
# `cargo tree -e normal,features` showed on 2026-10-10.
test-hooks = ["interweave-transport-composition/test-hooks"]

[dev-dependencies]
# TEST-ONLY: this crate with its own `test-hooks` on, for
# `tests/host.rs`'s runtime that ends on its own.
interweave-transport-embedded = { path = ".", features = ["test-hooks"] }
# A runtime of the test's own, to drop a host inside its async context.
tokio = { workspace = true, features = ["rt"] }
tempfile = { workspace = true }
# The software AES-256-GCM `SeedCipher` the custody tests seal and open
# with: the algorithm the Keystore's key runs, at the version already in
# the graph (libp2p's). Without its default `getrandom`, which would pull
# a second `rand_core` into the lockfile: the keys and IVs are the
# workspace's `rand`.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
rand = { workspace = true }
# The frozen identity vectors the custody round trip is held to.
serde_json = { workspace = true }
# The test's copy of the daemon's filter construction, the oracle
# `log_admits` is held to (`tests/log_filter.rs`).
tracing-subscriber = { workspace = true }
