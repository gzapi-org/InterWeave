#
# Configured bootstrap entries as discovery candidates. Configuration is
# not trust: a configured PeerId still needs an explicit trust rule before
# ConnectionManager will hold an ordinary data-plane connection to it
# (ADR-0010), and nothing in this crate can reach a trust decision.
#
# Addresses are validated and emitted WITHOUT resolution. A `/dns4/` entry
# stays a name here; resolving it is the dial path's job, which is what
# keeps a DNS outage a dial diagnostic rather than a discovery-provider
# health failure.
#
# What the BUILD can dial is narrower than that target today, and this
# comment is the third place the pair had to be kept together: with no
# `dns` transport on the libp2p feature list, `profile-config` refuses a
# `/dns4` or `/dns6` host at validation (`AddressHostNotBuilt`), so such
# an entry never reaches this provider. Nothing here changes -- it goes
# on emitting names unresolved, which is what its contract and its tests
# say -- and the refusal lifts with the feature. The crate's `lib.rs`
# and `README.md` carry the same caveat; `static-bootstrap.md`'s
# DNS-ownership section is the record.
[package]
name = "interweave-discovery-static"
version = "0.0.0"
publish = false
description = "Configured bootstrap discovery provider for InterWeave."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-discovery-api = { path = "../../api/discovery-api" }
interweave-transport-api = { path = "../../api/transport-api" }

[dev-dependencies]
# Synthetic test identities are built from BYTES, since `parse` decodes
# the base58btc and checks the multihash. Test-only.
bs58 = { workspace = true }
