#
# IPC v2 wire models and the frame codec. Language-neutral by contract
# (ADR-0039): no socket, stream, async runtime, or platform type appears
# here. This crate decides what the BYTES mean; carrying them is someone
# else's job, which is what lets the desktop daemon and a third-party
# client agree without sharing a transport implementation.
[package]
name = "interweave-ipc-protocol"
version = "0.0.0"
publish = false
description = "IPC v2 frame, handshake, and error models for InterWeave."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
interweave-local-client-api = { path = "../local-client-api" }
interweave-transport-api = { path = "../transport-api" }
serde = { workspace = true, features = ["derive"] }
# `raw_value`: an envelope keeps `params` and `data` as the bytes that
# arrived, so a frame re-encodes byte-exact (the golden frames) whatever
# the workspace's `Map` ordering is; `preserve_order` is enabled nowhere.
serde_json = { workspace = true, features = ["raw_value"] }
