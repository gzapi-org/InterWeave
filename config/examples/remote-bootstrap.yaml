schema_version: 2
profile: { name: remote }
transport:
  backend: libp2p
  listen:
    addresses: ["/ip4/0.0.0.0/tcp/4001"]
identity: {}
trust:
  policy: static-allowlist
  allowed_peers:
    - "<TRUSTED_REMOTE_PEER_ID>"
    - "<BOOTSTRAP_PEER_ID>"
    - "<BOOTSTRAP_PEER_ID_2>"
endpoints:
  registration_policy: configured-only
  default_direct_endpoint: claude
  directory: { enabled: true, cache_ttl: 60s, max_advertised: 16 }
  entries:
    - id: claude
      enabled: true
      advertise: true
      allowed_client_kinds: [claude-channel]
      inbound: { policy: inherit-profile-trust, allowed_peers: [] }
      outbound: { policy: inherit-profile-trust, allowed_peers: [] }

discovery:
  providers:
    - type: peer-cache
      enabled: true
      priority: 10
      config: { ttl: 7d, max_entries: 1024 }
    - type: static-bootstrap
      enabled: true
      priority: 30
      config:
        peers:
          - "/dns4/bootstrap-a.example.net/tcp/4001/p2p/<BOOTSTRAP_PEER_ID>"
          - "/dns4/bootstrap-b.example.net/tcp/4001/p2p/<BOOTSTRAP_PEER_ID_2>"
channels:
  desired: ["build-events"]
# Bootstrap configuration does NOT grant trust. This example separately allowlists the bootstrap
# PeerIds because v1 ConnectionManager will not dial an unauthorized data-plane peer.
# Allowlisting them permits data-plane connectivity but still grants no identity/membership authority.
