# One PeerId shared intentionally by a human client and Claude bridge.
schema_version: 2
profile: { name: human-and-claude }
transport:
  backend: libp2p
  listen: { addresses: ["/ip4/0.0.0.0/tcp/4001"] }
identity: {}
trust:
  policy: static-allowlist
  allowed_peers: ["<PEER_A>"]
endpoints:
  registration_policy: configured-only
  default_direct_endpoint: human
  directory: { enabled: true, cache_ttl: 60s, max_advertised: 16 }
  entries:
    - id: human
      enabled: true
      advertise: true
      allowed_client_kinds: [human-client]
      inbound: { policy: inherit-profile-trust, allowed_peers: [] }
      outbound: { policy: inherit-profile-trust, allowed_peers: [] }
    - id: claude
      enabled: true
      advertise: true
      allowed_client_kinds: [claude-channel]
      inbound: { policy: inherit-profile-trust, allowed_peers: [] }
      outbound: { policy: inherit-profile-trust, allowed_peers: [] }
discovery:
  providers:
    - type: peer-cache
      enabled: true
      priority: 10
      config: { ttl: 7d, max_entries: 1024 }
ipc:
  max_clients: 16
  client_event_queue: 256
  keepalive:
    enabled: true
    require_for_endpoint_lease: true
    interval: 30s
    response_timeout: 10s
    max_missed: 3
channels:
  desired: []
