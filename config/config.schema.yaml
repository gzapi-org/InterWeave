# Architecture-level schema illustration, not a production validator.
schema_version: 1
profile:
  name: string[1..64]
transport:
  backend: enum[libp2p]
  listen:
    addresses: list[string, max=16]
  limits:
    # Effective profile value is reported by TransportCapabilities.max_payload_bytes.
    max_payload_bytes: integer[1024..49152] = 49152
    max_connected_peers: integer[1..2048] = 256
    max_candidates: integer[1..16384] = 4096
    max_addresses_per_peer: integer[1..32] = 16
    max_subscriptions: integer[1..1024] = 128
  direct:
    timeout_ms: integer[1000..60000] = 10000
    max_inflight_total: integer[1..512] = 128
    max_inflight_per_peer: integer[1..32] = 8
  pubsub:
    backend: enum[gossipsub]
    signed_messages: literal[true]
    # Strict cryptographic/protocol validation plus explicit application
    # validation-result reporting per ADR-0029 (Accept/Ignore/Reject).
    strict_validation: literal[true]
    explicit_application_validation: literal[true]
identity:
  # Private key itself is NOT configuration. This is an optional path override.
  key_file: path?
trust:
  policy: enum[static-allowlist]
  allowed_peers: list[PeerId, max=4096]
discovery:
  providers: list[ProviderConfig, max=16]
  # ProviderConfig is a tagged union; each config namespace is provider-specific.
  types:
    peer-cache:
      enabled: bool
      priority: int
      config:
        ttl: duration
        max_entries: int
    mdns:
      enabled: bool
      priority: int
      config: {}
    static-bootstrap:
      enabled: bool
      priority: int
      config:
        peers: list[multiaddr-with-peer-id, max=64]
    kademlia:
      # Fully specified optional provider; default remains disabled.
      # A build without KademliaDiscovery rejects enabled=true at startup.
      enabled: bool = false
      priority: int
      config:
        config_version: literal[1] = 1
        # Required when enabled=true on a supporting build. Non-secret namespace.
        network_id: string[regex=^[a-z0-9][a-z0-9._-]{0,63}$]?
        mode: enum[client,server] = client
        # First integration deliberately reuses data-plane trust for DHT routers.
        routing_peer_policy: literal[data-plane-trusted]
        seed_sources: list[enum[peer-cache,mdns,static-bootstrap], max=3]
        candidate_ttl: duration = 30m
        kbucket_size: integer[8..20] = 20
        max_routing_peers: integer[20..1024] = 256
        query_timeout: duration[5s..120s] = 30s
        parallelism: integer[1..10] = 3
        disjoint_query_paths: bool = true
        max_concurrent_queries: integer[1..8] = 2
        max_queries_per_minute: integer[1..60] = 6
        exploration_interval: duration[30s..1h] = 60s
        exploration_jitter_percent: integer[0..50] = 20
        max_results_per_query: integer[1..20] = 20
        target_routing_peers: integer[8..256] = 64
        targeted_lookup_cooldown: duration[30s..1h] = 5m
        bootstrap_min_interval: duration[1m..1h] = 5m
        bootstrap_refresh_interval: duration[5m..24h] = 15m
        # Peer-routing-only design: value/provider records are not used.
        record_mode: literal[disabled]
channels:
  desired: list[ChannelId, max=128]
ipc:
  # IPC JSON-body hard ceiling is fixed at 131072 bytes in v1 and is not
  # operator configurable. It must carry the max transport payload after base64url.
  max_clients: integer[1..64] = 16
  client_event_queue: integer[16..1024] = 256
observability:
  log_level: enum[error,warn,info,debug] = info
  payload_logging: literal[false]
