# Architecture-level schema illustration, not a production validator.
schema_version: 2
profile:
  name: string[1..64]
transport:
  backend: enum[libp2p]
  listen:
    addresses: list[string, max=16]
  limits:
    # Effective profile value is reported by TransportCapabilities.max_payload_bytes.
    max_payload_bytes: integer[1024..49152] = 49152
    max_connected_peers: integer[1..2048] = 256
    max_connections_total: integer[1..4096] = 384
    max_connections_per_peer: integer[1..8] = 3
    max_candidates: integer[1..16384] = 4096
    max_addresses_per_peer: integer[1..32] = 16
    max_subscriptions: integer[1..1024] = 128
  direct:
    protocol: literal[/claude-p2p-channel/direct/2.0.0]
    timeout_ms: integer[1000..60000] = 10000
    max_inflight_total: integer[1..512] = 128
    max_inflight_per_peer: integer[1..32] = 8
  pubsub:
    backend: enum[gossipsub]
    signed_messages: literal[true]
    # Strict cryptographic/protocol validation plus explicit application
    # validation-result reporting per ADR-0029 (Accept/Ignore/Reject).
    strict_validation: literal[true]
    explicit_application_validation: literal[true]
  connectivity:
    # Mandatory standard-v1 reachability stack. Reduced builds that omit any
    # required client mechanism are non-standard and must declare that limitation.
    required: literal[true] = true
    infrastructure:
      # Protocol-scoped connectivity authorization only. This does NOT grant
      # GossipSub/direct/endpoint-directory/Kademlia data-plane trust.
      allowed_peers: list[PeerId, max=256]
    address_advertisement:
      advertise_unverified_public_direct: literal[false] = false
      advertise_active_relay_addresses: literal[true] = true
    autonat:
      version: literal[2] = 2
      client:
        enabled: literal[true] = true
        static_servers: list[multiaddr-with-peer-id, max=16]
        use_authorized_identify_servers: bool = true
        required_distinct_successes: integer[1..4] = 2
        success_evidence_ttl: duration[1m..1h] = 15m
        retry_interval: duration[10s..5m] = 30s
        refresh_interval: duration[1m..30m] = 5m
        max_inflight_probes: integer[1..8] = 2
        max_candidate_addresses_per_cycle: integer[1..16] = 4
        timeout: duration[5s..60s] = 15s
      server:
        enabled: bool = false
        max_concurrent_probes: integer[1..64] = 8
        max_probes_per_peer_per_minute: integer[1..30] = 2
        max_probes_global_per_minute: integer[1..600] = 60
        timeout: duration[5s..60s] = 15s
    relay:
      client:
        enabled: literal[true] = true
        static_relays: list[multiaddr-with-peer-id, max=16]
        use_authorized_identify_relays: bool = true
        target_reservations_private_or_unknown: integer[1..4] = 2
        target_reservations_public: integer[0..4] = 1
        max_reservations: integer[1..8] = 4
        retry_min: duration[1s..1m] = 5s
        retry_max: duration[30s..30m] = 5m
        direct_head_start: duration[0ms..5s] = 750ms
      server:
        enabled: bool = false
        max_reservations: integer[1..512] = 64
        max_reservations_per_peer: integer[1..4] = 1
        reservation_duration: duration[5m..24h] = 1h
        max_circuits: integer[1..1024] = 128
        max_circuits_per_peer: integer[1..16] = 4
        max_circuit_duration: duration[1m..24h] = 1h
        max_circuit_bytes: bytes[1MiB..1GiB] = 64MiB
        max_pending_control: integer[1..512] = 64
    dcutr:
      enabled: literal[true] = true
      max_inflight: integer[1..32] = 4
      max_inflight_per_peer: literal[1] = 1
      retry_cooldown: duration[30s..1h] = 5m
      direct_stability_period: duration[1s..2m] = 10s
    # Cross-field validation:
    #   relay.client.target_reservations_private_or_unknown <= relay.client.max_reservations
    #   relay.client.target_reservations_public <= relay.client.max_reservations
    #   relay.client.target_reservations_public <= target_reservations_private_or_unknown
    #   relay.client.retry_min <= relay.client.retry_max
    #   relay.server.max_reservations_per_peer <= relay.server.max_reservations
    #   relay.server.max_circuits_per_peer <= relay.server.max_circuits
    #   dcutr.max_inflight_per_peer <= dcutr.max_inflight
    #   every static relay/AutoNAT server PeerId is in either trust.allowed_peers
    #   or transport.connectivity.infrastructure.allowed_peers
    #   a PeerId in both sets is treated as DataPlaneTrusted for protocol admission
identity:
  # Initial software identity algorithm is fixed so portable backup/restore is exact.
  algorithm: literal[ed25519] = ed25519
  # Private key itself is NOT configuration. This is an optional path override.
  key_file: path?
  # Recovery phrases/formats are offline identity-tool concerns, never config values or IPC.
trust:
  policy: enum[static-allowlist]
  allowed_peers: list[PeerId, max=4096]

endpoints:
  # Model B: one profile PeerId, multiple configured local routes.
  registration_policy: literal[configured-only]
  default_direct_endpoint: EndpointId?
  directory:
    enabled: bool = true
    cache_ttl: duration[10s..5m] = 60s
    max_advertised: integer[1..32] = 16
    max_queries_per_minute_per_peer: integer[1..60] = 12
    max_inflight_queries: integer[1..64] = 16
  entries: list[EndpointConfig, max=64]
  EndpointConfig:
    id: string[regex=^[a-z][a-z0-9._-]{0,63}$]
    enabled: bool = true
    advertise: bool = false
    # Hygiene guard only; client.kind is not cryptographic authentication.
    allowed_client_kinds: list[string, max=8]
    inbound:
      policy: enum[inherit-profile-trust,static-subset] = inherit-profile-trust
      allowed_peers: list[PeerId, max=4096]
    outbound:
      policy: enum[inherit-profile-trust,static-subset] = inherit-profile-trust
      allowed_peers: list[PeerId, max=4096]
  # Cross-field validation:
  #   endpoint IDs are unique
  #   default_direct_endpoint, when set, references an enabled endpoint
  #   static-subset allowed_peers are subsets of trust.allowed_peers
  #   endpoint policy can narrow but never widen profile trust
  #   number of advertise=true enabled entries <= directory.max_advertised
discovery:
  providers: list[ProviderConfig, max=16]
  # ProviderConfig is a tagged union; each config namespace is provider-specific.
  types:
    peer-cache:
      enabled: bool
      priority: int
      config:
        ttl: duration
        max_entries: int
    mdns:
      enabled: bool
      priority: int
      config: {}
    static-bootstrap:
      enabled: bool
      priority: int
      config:
        peers: list[multiaddr-with-peer-id, max=64]
    kademlia:
      # Standard v1 supports this provider; configured entries default enabled.
      # A reduced/custom build without KademliaDiscovery rejects enabled=true.
      enabled: bool = true
      priority: int
      config:
        config_version: literal[1] = 1
        # Required when enabled=true on a supporting build. Non-secret namespace.
        network_id: string[regex=^[a-z0-9][a-z0-9._-]{0,63}$]?
        mode: enum[client,server] = client
        # First integration deliberately reuses data-plane trust for DHT routers.
        routing_peer_policy: literal[data-plane-trusted]
        # If Kademlia is enabled, every named source must have a configured
        # provider entry in this profile and that provider must itself be enabled.
        seed_sources: list[enum[peer-cache,mdns,static-bootstrap], max=3]
        candidate_ttl: duration = 30m
        kbucket_size: integer[8..20] = 20
        max_routing_peers: integer[20..1024] = 256
        query_timeout: duration[5s..120s] = 30s
        parallelism: integer[1..10] = 3
        disjoint_query_paths: bool = true
        max_concurrent_queries: integer[1..8] = 2
        max_queries_per_minute: integer[1..60] = 6
        exploration_interval: duration[30s..1h] = 60s
        exploration_jitter_percent: integer[0..50] = 20
        max_results_per_query: integer[1..20] = 20
        target_routing_peers: integer[8..256] = 64
        targeted_lookup_cooldown: duration[30s..1h] = 5m
        bootstrap_min_interval: duration[1m..1h] = 5m
        bootstrap_refresh_interval: duration[5m..24h] = 15m
        # Hard cross-field validation when Kademlia enabled=true:
        #   target_routing_peers <= max_routing_peers
        #   bootstrap_refresh_interval >= bootstrap_min_interval
        #   max_results_per_query <= kbucket_size
        #   every seed_sources entry resolves to a configured enabled provider
        # Effective runtime routing target additionally caps target_routing_peers
        # by the remote trust.allowlist population; no-progress exploration can
        # enter a bounded saturated state and backs off instead of polling forever.
        # Peer-routing-only design: value/provider records are not used.
        record_mode: literal[disabled]
channels:
  desired: list[ChannelId, max=128]
ipc:
  # IPC protocol version is negotiated in hello and is deliberately not an
  # operator profile setting. The body ceiling is likewise a v2 protocol constant.
  max_clients: integer[1..64] = 16
  client_event_queue: integer[16..1024] = 256
  keepalive:
    enabled: bool = true
    # When true, any IPC client claiming a data-plane EndpointId lease MUST
    # negotiate the keepalive feature in hello. Admin/diagnostic sessions that
    # claim no endpoint are unaffected.
    require_for_endpoint_lease: bool = true
    interval: duration[10s..5m] = 30s
    response_timeout: duration[2s..1m] = 10s
    max_missed: integer[1..10] = 3
    # Cross-field when enabled=true: response_timeout < interval.
    # If require_for_endpoint_lease=true, keepalive.enabled must also be true.
observability:
  log_level: enum[error,warn,info,debug] = info
  payload_logging: literal[false]
